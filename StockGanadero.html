<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f5f0e8;color:#2a1f0e;min-height:100vh;overflow-x:hidden}
header{background:linear-gradient(135deg,#2d4a1e,#3d6428,#1a2e12);color:#e8dfc8;padding:1rem 1.5rem;display:flex;align-items:center;gap:1rem;box-shadow:0 3px 12px rgba(0,0,0,.3);flex-wrap:wrap}
header img{height:50px;width:50px;object-fit:contain;border-radius:4px;flex-shrink:0}
.htitulo{flex:1}
header h1{font-size:1.4rem;color:#f0e6c8;margin-bottom:2px}
header p{font-size:.8rem;color:#a8c890}
.hbtns{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.hbtn{display:flex;align-items:center;gap:.35rem;background:rgba(255,255,255,.13);color:#f0e6c8;border:1px solid rgba(255,255,255,.25);border-radius:7px;padding:.38rem .8rem;font-size:.78rem;font-weight:600;cursor:pointer;white-space:nowrap;transition:background .15s}
.hbtn:hover{background:rgba(255,255,255,.23)}
.hbtn.grn{background:rgba(46,139,60,.55);border-color:rgba(46,180,70,.4)}
.hbtn.grn:hover{background:rgba(46,139,60,.8)}
.hbtn.blu{background:rgba(30,90,180,.5);border-color:rgba(80,140,220,.4)}
.hbtn.blu:hover{background:rgba(30,90,180,.75)}
.hbtn.org{background:rgba(180,100,20,.55);border-color:rgba(220,150,50,.4)}
.hbtn.org:hover{background:rgba(180,100,20,.8)}
.sync-bar{background:#1a2e12;border-bottom:1px solid #3d6428;padding:.4rem 1.5rem;font-size:.78rem;color:#a8c890;display:flex;align-items:center;gap:.6rem}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#22c55e;display:inline-block;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.sync-dot.offline{background:#f87171;animation:none}
nav{background:#2d4a1e;display:flex;overflow-x:auto;padding:0 .5rem;gap:0}
nav button{background:none;border:none;border-bottom:3px solid transparent;color:#8fb878;padding:.65rem .9rem;cursor:pointer;font-size:.8rem;white-space:nowrap;font-weight:600;transition:all .15s}
nav button:hover{color:#c8e8a8}
nav button.active{color:#f0e6c8;border-bottom-color:#8fb878;background:rgba(255,255,255,.07)}
main{max-width:1100px;margin:0 auto;padding:1.2rem 1rem 3rem;box-sizing:border-box}
.card{background:#fff;border-radius:10px;padding:1.4rem;margin-bottom:1.1rem;box-shadow:0 2px 8px rgba(45,74,30,.08);border:1px solid #ddd8cc;overflow:hidden}
h2{font-size:1.05rem;color:#2d4a1e;margin-bottom:.9rem;font-weight:700}
h3{font-size:.95rem;color:#2d4a1e;margin-bottom:.9rem;font-weight:700}
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:.7rem;margin-bottom:.8rem}
.fg label{display:flex;flex-direction:column;gap:.25rem;font-size:.8rem;font-weight:600;color:#4a3820;min-width:0}
.fg .s2{grid-column:span 2}
.fg input,.fg select{border:1.5px solid #c8c0b0;border-radius:6px;padding:.4rem .55rem;font-size:.85rem;font-family:inherit;background:#faf8f4;color:#2a1f0e;width:100%;min-width:0;box-sizing:border-box}
.fg input:focus,.fg select:focus{outline:none;border-color:#3d6428}
@media(max-width:700px){
  .fg{grid-template-columns:1fr 1fr}
  .fg .s2, .fg label[style*="span 2"]{grid-column:1 / -1}
}
.br{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.4rem}
.bp{background:#2d4a1e;color:#f0e6c8;border:none;border-radius:7px;padding:.5rem 1.1rem;font-size:.85rem;font-weight:600;cursor:pointer}
.bp:hover{background:#3d6428}
.bs{background:#e8dfc8;color:#2d4a1e;border:1.5px solid #b8a888;border-radius:7px;padding:.5rem 1.1rem;font-size:.85rem;font-weight:600;cursor:pointer}
.bi{background:none;border:none;cursor:pointer;font-size:.95rem;padding:.15rem}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.81rem}
th{background:#2d4a1e;color:#e8dfc8;padding:.45rem .65rem;text-align:left;font-weight:600;white-space:nowrap}
td{padding:.4rem .65rem;border-bottom:1px solid #e8e0d0;vertical-align:middle}
tr:hover td{background:#f5f0e8}
.ri td{border-left:3px solid #4a8c28}
.re td{border-left:3px solid #c84a28}
.tr td{background:#f0ebe0;font-weight:700;border-top:2px solid #b8a888}
.empty{text-align:center;color:#888;padding:1.5rem;font-style:italic}
.obs{max-width:340px;min-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#666;font-size:.78rem}
.ni{color:#2d6a10;font-weight:600}
.ne{color:#c84a28;font-weight:600}
.bi2{background:#d4f0c0;color:#2a5c10;border-radius:4px;padding:.12rem .45rem;font-size:.76rem;font-weight:700}
.be2{background:#fad0c0;color:#8c2810;border-radius:4px;padding:.12rem .45rem;font-size:.76rem;font-weight:700}
.ba{background:#d0e8f8;color:#185888;border-radius:4px;padding:.12rem .45rem;font-size:.76rem;font-weight:700}
.bc{background:#e8d4a8;color:#5a3c10;border-radius:4px;padding:.18rem .55rem;font-size:.8rem;font-weight:700;margin-left:.4rem}
.sg{color:#2a6010;font-weight:700}
.sr{color:#c82010;font-weight:700}
.sg2{color:#888}
.hint{font-size:.8rem;color:#6a5840;margin-bottom:.8rem;font-style:italic}
pre.csvpre{background:#1a1a1a;color:#a0e060;padding:.9rem;border-radius:6px;font-size:.72rem;overflow-x:auto;margin-top:.9rem;line-height:1.5;white-space:pre}
.kg{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:.7rem;margin-bottom:.5rem}
.kp{background:#f5f0e8;border-radius:8px;padding:.8rem .9rem;border:1px solid #ddd8cc}
.kl{font-size:.72rem;font-weight:700;color:#5a4020;text-transform:uppercase;letter-spacing:.03em;margin-bottom:.25rem}
.kv{font-size:1.3rem;color:#2d4a1e;font-weight:700}
.ks{margin:.15rem 0;font-size:.88rem}
.km{font-size:.7rem;color:#888}
.pc{border-top:4px solid #3d6428}
.rw{display:flex;align-items:center;gap:.6rem;margin-top:.25rem}
.rw input[type=range]{flex:1;accent-color:#3d6428}
.rv{font-size:.95rem;font-weight:700;color:#2d4a1e;min-width:55px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1000;display:flex;align-items:center;justify-content:center;padding:1rem}
.modal-box{background:#fff;border-radius:12px;padding:1.5rem;width:100%;max-width:420px;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-box h2{color:#2d4a1e;margin-bottom:.4rem;font-size:1.1rem}
.modal-box p{font-size:.8rem;color:#888;margin-bottom:1rem}
.campo-item{display:flex;align-items:center;justify-content:space-between;padding:.55rem .7rem;border-radius:6px;cursor:pointer;border:2px solid transparent;margin-bottom:.3rem;font-size:.9rem}
.campo-item:hover{background:#f5f0e8}
.campo-item.sel{border-color:#3d6428;background:#eaf5e0}
.campo-item.inactivo{opacity:.45;text-decoration:line-through}
.modal-add{display:flex;gap:.5rem;margin-top:.8rem}
.modal-add input{flex:1;border:1.5px solid #c8c0b0;border-radius:6px;padding:.45rem .6rem;font-size:.85rem;font-family:inherit}
.modal-add input:focus{outline:none;border-color:#3d6428}
.modal-footer-btns{display:flex;gap:.5rem;margin-top:1rem;flex-wrap:wrap}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:1rem;color:#3d6428;font-size:1.1rem}
.spinner{width:40px;height:40px;border:4px solid #d4e8c0;border-top-color:#3d6428;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:24px;right:24px;background:#2d4a1e;border:1px solid #3d6428;border-radius:10px;padding:12px 20px;color:#f0e6c8;font-weight:600;z-index:2000;box-shadow:0 8px 32px rgba(0,0,0,.3);animation:slideUp .3s ease}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
@media print{nav,.hbtns,.br,.bi,button{display:none!important}.card{box-shadow:none;border:1px solid #ccc;break-inside:avoid}body{background:#fff}}
@media(max-width:600px){.kg{grid-template-columns:1fr 1fr}.fg .s2{grid-column:span 1}header h1{font-size:1.1rem}nav button{font-size:.72rem;padding:.55rem .65rem}.hbtns{width:100%}}

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set as _set, get, remove as _remove, onValue as _onValue, push } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

/* ══════════ CAPA OFFLINE ══════════
   1) Cache local: cada dato que llega de Firebase se guarda en el dispositivo.
      Al abrir sin señal, la app arranca al instante con los últimos datos vistos.
   2) Cola de escrituras: lo que se carga/edita sin señal queda guardado en el
      dispositivo y se sube solo cuando vuelve el internet (aunque hayas cerrado la app). */
function pathOf(r){
  try{ return decodeURIComponent(new URL(r.toString()).pathname.slice(1)); }catch(e){ return ""; }
}
function onValue(r,cb){
  const path=pathOf(r);
  const cacheable=path&&!path.startsWith(".info");
  if(cacheable){
    try{
      const c=localStorage.getItem("sgcache_"+path);
      if(c!==null) cb({ val:()=>JSON.parse(c) });   // hidratar al instante desde el dispositivo
    }catch(e){}
  }
  return _onValue(r,snap=>{
    if(cacheable){ try{ localStorage.setItem("sgcache_"+path,JSON.stringify(snap.val())); }catch(e){} }
    cb(snap);
  });
}
function leerCola(){ try{ return JSON.parse(localStorage.getItem("sg_cola")||"[]"); }catch(e){ return []; } }
function guardarCola(c){ try{ localStorage.setItem("sg_cola",JSON.stringify(c.slice(-500))); }catch(e){} }
function encolar(op){ const c=leerCola(); c.push(op); guardarCola(c); }
function sacarDeCola(id){ guardarCola(leerCola().filter(o=>o.id!==id)); }
function opId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2); }
function set(r,val){
  const op={id:opId(),t:"set",path:pathOf(r),val:val===undefined?null:val};
  encolar(op);
  _set(r,op.val).then(()=>sacarDeCola(op.id)).catch(()=>sacarDeCola(op.id));
  actualizarBarraPendientes();
  return Promise.resolve();  // no esperar al servidor: sin señal, la app sigue andando
}
function remove(r){
  const op={id:opId(),t:"del",path:pathOf(r)};
  encolar(op);
  _remove(r).then(()=>sacarDeCola(op.id)).catch(()=>sacarDeCola(op.id));
  actualizarBarraPendientes();
  return Promise.resolve();
}
let colaReintentando=false;
function reintentarCola(){
  if(colaReintentando)return;
  const c=leerCola(); if(c.length===0)return;
  colaReintentando=true;
  let rest=c.length;
  for(const op of c){
    const r=ref(db,op.path);
    const p=op.t==="del"?_remove(r):_set(r,op.val);
    p.then(()=>sacarDeCola(op.id)).catch(()=>{}).finally(()=>{ if(--rest===0){colaReintentando=false;actualizarBarraPendientes();} });
  }
}
function actualizarBarraPendientes(){ if(typeof render==="function"&&state&&state.loaded&&state.usuariosLoaded)render(); }
// Aviso si la app nunca se abrio con internet en este dispositivo
setTimeout(()=>{
  const r=document.getElementById("root");
  if(r&&/Conectando/.test(r.textContent||"")&&leerColaCacheVacia()){

  }
},8000);

// ── HELPERS ──
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2);
function usuarioActual(){ return state.sesion?state.usuarios[state.sesion.id]:null; }
function esAdmin(){ const u=usuarioActual(); return !!u&&u.rol==="admin"&&!u.baja; }
function esOperario(){ const u=usuarioActual(); return !!u&&u.rol!=="admin"&&!u.baja; }
function adminsActivos(){ return Object.values(state.usuarios).filter(u=>u&&u.rol==="admin"&&!u.baja); }
function campos(){
  const fromList = Object.values(state.camposList).filter(c=>c.activo).map(c=>c.nombre).sort();
  if(fromList.length>0) return fromList;
  return [...new Set([...Object.values(state.mov).map(m=>m.campo),...Object.values(state.act).map(a=>a.campo)].filter(Boolean))].sort();
}
function ciclos(){
  const re=/^\d{4}\/\d{4}$/;
  return [...new Set([...Object.values(state.mov).map(m=>m.ciclo),...Object.values(state.act).map(a=>a.ciclo)].filter(c=>{
    if(!c||!re.test(c))return false;
    const anio=parseInt(c.split('/')[0]);
    return anio>=2023;
  }))].sort();
}
function renspaDe(nombreCampo){
  const c=Object.values(state.camposList).find(x=>x.nombre===nombreCampo);
  return c&&c.renspa?c.renspa:"";
}
function observaciones(){ return [...new Set([...Object.values(state.mov).map(m=>m.obs),...Object.values(state.act).map(a=>a.obs)].filter(o=>o&&o.trim()))].sort(); }
function actividadesAll(todas){
  // todas=true: incluye tambien las base desactivadas (para filtros y edicion)
  const custom=Object.values(state.actividadesCustom||{});
  const inactivas=custom.filter(c=>!c.activo).map(c=>c.nombre.toLowerCase());
  const customActivas=custom.filter(c=>c.activo).map(c=>c.nombre);
  const baseOff=state.actBaseOff||{};
  const base=todas?ACT:ACT.filter(t=>!baseOff[t]);
  const enRegistros=Object.values(state.act).map(a=>a.tipo)
    .filter(t=>t&&!ACT.includes(t)&&!inactivas.includes(t.toLowerCase()));
  return [...new Set([...base,...customActivas,...enRegistros])];
}

function h(str){ return String(str||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function opts(arr,sel,empty){ return (empty?`<option value="">${empty}</option>`:"")+arr.map(v=>`<option${v===sel?" selected":""}>${h(v)}</option>`).join(""); }
function sem(val,min,suffix){
  suffix=suffix||"%";
  if(val===null||val===undefined||isNaN(val)) return `<span class="sg2">—</span>`;
  const ok=val>=min;
  return `<span class="${ok?"sg":"sr"}">${ok?"🟢":"🔴"} ${val.toFixed(1)}${suffix}</span>`;
}
function semMax(val,max,suffix){
  suffix=suffix||"%";
  if(val===null||val===undefined||isNaN(val)) return `<span class="sg2">—</span>`;
  const ok=val<=max;
  return `<span class="${ok?"sg":"sr"}">${ok?"🟢":"🔴"} ${val.toFixed(1)}${suffix}</span>`;
}
function pct(n,d){ return d>0 ? n/d*100 : null; }
function toast(msg){
  const el=document.createElement("div"); el.className="toast"; el.textContent=msg;
  document.body.appendChild(el); setTimeout(()=>el.remove(),3000);
}

async function saveMov(data){
  const id = data.id || uid();
  await set(ref(db,`mov/${id}`),{...data,id});
  toast("✅ Movimiento guardado");
}
async function saveAct(data){
  const id = data.id || uid();
  await set(ref(db,`act/${id}`),{...data,id});

async function savePar(data){

function render(){
  const root=document.getElementById("root");
  if(!state.loaded||!state.usuariosLoaded){ root.innerHTML=`<div class="loading"><div class="spinner"></div><span>Conectando...</span></div>`; return; }
  // Preservar lo tipeado en login/setup/alta de usuario si un dato de Firebase llega en el medio
  const preserveIds=["lg_nombre","lg_clave","su_nombre","su_clave","su_clave2","nu_nombre","nu_clave",
    ...Array.from(document.querySelectorAll('input[id^="bl_"],input[id^="pr_"],input[id^="pp_"],textarea[id^="pp_"],input[id^="an_"],select[id^="an_"],input[id^="nu_"],select[id^="nu_"],input[id^="pe_"],input[id^="ev_"],select[id^="ev_"],input[id^="ma_"],select[id^="ma_"],textarea[id^="tr_"],input[id^="tr_"],textarea[id^="mgrp"],input[id^="mg_"],select[id^="mg_"],input[id^="mo_"],textarea[id^="cp_"],input[id^="cp_"],select[id^="cp_"]')).map(e=>e.id)];
  const saved={}; let focusId=null;
  for(const id of preserveIds){const el=document.getElementById(id);if(el){saved[id]=el.value;if(document.activeElement===el)focusId=id;}}
  // ¿Hay algun administrador dado de alta? Si no, pantalla de configuracion inicial
  if(adminsActivos().length===0 && Object.values(state.usuarios).filter(u=>u&&u.rol==="admin").length===0){
    root.innerHTML=buildSetup();
  } else if(!usuarioActual()||usuarioActual().baja){
    if(state.sesion){state.sesion=null;try{localStorage.removeItem("sg_sesion");}catch(e){}}
    root.innerHTML=buildLogin();
  } else {
    if(esOperario()&&!OP_TABS.includes(state.tab))state.tab=OP_TABS[0];
    root.innerHTML=buildApp();
    attachEvents();
    aplicarModoLectura();
  }
  for(const id of Object.keys(saved)){const el=document.getElementById(id);if(el)el.value=saved[id];}
  if(focusId){const el=document.getElementById(focusId);if(el){el.focus();try{el.setSelectionRange(el.value.length,el.value.length);}catch(e){}}}
}

// Modo solo-lectura para operarios: oculta acciones y bloquea inputs que no sean filtros
function aplicarModoLectura(){
  if(!esOperario())return;
  if(state.tab===MANGA_TAB)return; // en la manga el operario trabaja con todo habilitado
  const permitido=/^\s*(setF|toggleF|limpiarF|cerrarPopupRec)/;
  const main=document.querySelector("main"); if(!main)return;
  main.querySelectorAll("[onclick]").forEach(el=>{
    if(!permitido.test(el.getAttribute("onclick")||""))el.style.display="none";
  });
  main.querySelectorAll("input,select,textarea").forEach(el=>{
    if(!permitido.test(el.getAttribute("onchange")||""))el.disabled=true;
  });
}

// ── STOCK ──
function renderStock(){
  const f=state.filtStock; const clist=campos();
  const fil=Object.values(state.mov).filter(m=>{
    if(f.hasta&&m.fecha>f.hasta)return false;
    if(f.campo&&m.campo!==f.campo)return false;
    if(f.cat&&m.cat!==f.cat)return false;
    return true;
  });
  const smap={};
  for(const m of fil){
    if(!smap[m.campo])smap[m.campo]={};
    if(!smap[m.campo][m.cat])smap[m.campo][m.cat]={stock:0,ing:0,egr:0,muertes:0};
    const r=smap[m.campo][m.cat];
    if(m.tipo==="ingreso"){r.stock+=m.cant;r.ing+=m.cant}
    else{r.stock-=m.cant;r.egr+=m.cant;if(m.sub==="Muerte")r.muertes+=m.cant}
  }
  const rows=[];
  for(const c of Object.keys(smap))for(const cat of Object.keys(smap[c])){const d=smap[c][cat];rows.push({campo:c,cat,...d,p:d.ing>0?d.muertes/d.ing*100:0})}
  const fechaCSV=f.hasta||new Date().toISOString().slice(0,10);
  const csv=[["Fecha","Campo","Categoria","Ingresos","Egresos","Muertes","% Muertes","Stock"],...rows.map(r=>[fechaCSV,r.campo,r.cat,r.ing,r.egr,r.muertes,r.p.toFixed(1),r.stock])].map(r=>r.join(",")).join("\n");
  const campos2=Object.keys(smap);
  return `
<div class="card">
  <h2>📊 Resumen de Stock</h2>
  <p class="hint">Filtra por fecha para ver el stock en una fecha determinada. CSV compatible con Power Query.</p>
  <div class="fg">
    <label>Stock al (fecha)<input type="date" value="${f.hasta}" onchange="setFS('hasta',this.value)"/></label>
    <label>Campo<select onchange="setFS('campo',this.value)">${opts(clist,f.campo,"Todos")}</select></label>
    <label>Categoria<select onchange="setFS('cat',this.value)">${opts(CATS,f.cat,"Todas")}</select></label>
  </div>
  <div class="br">
    <button class="bp" id="dlCSV">⬇️ Descargar CSV (Power Query)</button>
    <button class="bs" id="togCSV">${state.showCSV?"Ocultar":"Ver"} CSV</button>
  </div>
  ${state.showCSV?`<pre class="csvpre">${h(csv)}</pre>`:""}
</div>
${campos2.length===0?`<div class="card"><p class="empty">Sin datos.</p></div>`:`
${(()=>{
  // ── RESUMEN GENERAL TOTAL ──
  const allCats={};
  for(const campo of campos2){
    for(const [cat,d] of Object.entries(smap[campo])){
      if(!allCats[cat])allCats[cat]={ing:0,egr:0,muertes:0,stock:0};
      allCats[cat].ing+=d.ing; allCats[cat].egr+=d.egr;
      allCats[cat].muertes+=d.muertes; allCats[cat].stock+=d.stock;
    }
  }
  const gtotI=Object.values(allCats).reduce((s,d)=>s+d.ing,0);
  const gtotE=Object.values(allCats).reduce((s,d)=>s+d.egr,0);
  const gtotM=Object.values(allCats).reduce((s,d)=>s+d.muertes,0);
  const gtotS=Object.values(allCats).reduce((s,d)=>s+d.stock,0);
  // resumen por campo (una fila por campo)
  const campoTots=campos2.map(campo=>{
    const cats=smap[campo];
    return{
      campo,
      ing:Object.values(cats).reduce((s,d)=>s+d.ing,0),
      egr:Object.values(cats).reduce((s,d)=>s+d.egr,0),
      muertes:Object.values(cats).reduce((s,d)=>s+d.muertes,0),
      stock:Object.values(cats).reduce((s,d)=>s+d.stock,0)
    };
  });
  return `
<div class="card" style="border-top:4px solid #2d4a1e">
  <h2>🌐 Resumen General${f.hasta?" al "+f.hasta.split('-').reverse().join('/'):" (stock actual)"}</h2>
  <div class="kg" style="margin-bottom:1rem">
    <div class="kp" style="background:#eaf5e0;border-color:#3d6428">
      <div class="kl">Total Animales</div>
      <div class="kv" style="font-size:2rem;color:#2d4a1e">${gtotS}</div>
      <div class="km">${campos2.length} campo(s)</div>
    </div>
    ${campoTots.map(ct=>`
    <div class="kp">
      <div class="kl">🏡 ${h(ct.campo)}</div>
      <div class="kv">${ct.stock}</div>
      <div class="km">ing:+${ct.ing} egr:-${ct.egr}</div>

function renderComercial(){

    if(catsSel&&!catsSel.includes(m.cat))return false;

    if(!smap[m.campo])smap[m.campo]={};

// ── STOCK REPRODUCTIVO ──
function renderStockRep(){
  const f=state.filtStockRep;
  const clist=campos();
  const cilist=ciclos().filter(c=>{const a=parseInt(c.split('/')[0]);return a>=2026;});
  const ESTADOS=["Preñez","Cut","Vacias","2da oportunidad","Selección a IATF","Descarte"];
  const CATS_REP=["Vacas","Vaquillonas"];

  // Si el array esta vacio = todos
  const ciclosSel = (f.ciclos&&f.ciclos.length>0) ? f.ciclos : cilist;
  const estadosSel = (f.estados&&f.estados.length>0) ? f.estados : ESTADOS;

  function enCiclo(c){ return (!f.ciclos||f.ciclos.length===0) ? true : f.ciclos.includes(c); }

  // Suma acumulada de un estado a la fecha de corte, por campo/categoria (sumando los ciclos seleccionados)
  function saldo(campo,cat,estado){
    let total=Object.values(state.act).filter(a=>
      a.tipo===estado &&
      a.campo===campo &&
      enCiclo(a.ciclo) &&
      a.cat===cat &&
      (!f.hasta||(a.fecha&&a.fecha<=f.hasta))
    ).reduce((s,a)=>s+(a.cant||0),0);

    // Ajuste por traslados de rodeo (mueven Preñez, Cut, 2da oportunidad, Descarte; NO Selección a IATF)
    if(estado!=="Selección a IATF"){
      const traslados=Object.values(state.act).filter(a=>
        a.tipo==="Traslado de rodeo" &&
        a.cat===cat &&
        enCiclo(a.ciclo) &&
        (!f.hasta||(a.fecha&&a.fecha<=f.hasta))
      );
      for(const t of traslados){
        let mueve=0;
        if(estado==="Preñez") mueve=t.trPre||0;
        else if(estado==="Cut") mueve=t.trCut||0;
        else if(estado==="2da oportunidad") mueve=t.trSeg||0;
        else if(estado==="Descarte") mueve=t.trDsc||0;
        if(mueve>0){
          if(t.campo===campo) total-=mueve;
          if(t.trDestino===campo) total+=mueve;
        }
      }
    }
    // Ajuste por Cambios de estado reproductivo (mueven de un estado a otro, mismo campo)
    const cambios=Object.values(state.act).filter(a=>
      a.tipo==="Cambio de estado" &&
      a.campo===campo &&
      a.cat===cat &&
      enCiclo(a.ciclo) &&
      (!f.hasta||(a.fecha&&a.fecha<=f.hasta))
    );
    for(const c of cambios){
      const n=c.ceCant||0, o=c.ceOrigen, d=c.ceDestino;
      const po=PADRE_ESTADO[o], pd=PADRE_ESTADO[d];
      // Sale del origen (salvo que el origen sea el padre del destino: sigue perteneciendo, ej Preñez→Cut)
      if(o===estado && o!==pd) total-=n;
      // Entra al destino (salvo que el destino sea el padre del origen: ya estaba contado ahi, ej Cut→Preñez)
      if(d===estado && d!==po) total+=n;
      // Sale tambien del padre del origen si deja esa familia (ej Cut→Vacias o Cut→Baja resta de Preñez)
      if(po===estado && po!==d && po!==pd) total-=n;
      // Entra tambien al padre del destino si viene de otra familia (ej Preñez→Descarte suma a Vacias)
      if(pd===estado && pd!==o && pd!==po) total+=n;
    }
    return total;
  }

  const camposShow = f.campo ? [f.campo] : [...new Set([
    ...Object.values(state.act).filter(a=>enCiclo(a.ciclo)).map(a=>a.campo),
    ...Object.values(state.act).filter(a=>a.tipo==="Traslado de rodeo"&&enCiclo(a.ciclo)).map(a=>a.trDestino)
  ].filter(Boolean))];

  const catsShow = f.cat ? [f.cat] : CATS_REP;
  const estadosShow = estadosSel;

  return `
<div class="card">
  <h2>🐄 Stock Reproductivo</h2>
  <p class="hint">Cantidad de animales en cada estado reproductivo a la fecha de corte. Incluye los movimientos por traslado de rodeo. No afecta el resumen Productivo. En Ciclo y Estado podés marcar varios; si no marcás ninguno, se muestran todos.</p>
  <div class="fg">
    <label>Stock al (fecha)<input type="date" value="${f.hasta}" onchange="setFSR('hasta',this.value)"/></label>
    <label>Campo<select onchange="setFSR('campo',this.value)">${opts(clist,f.campo,"Todos")}</select></label>
    <label>Categoria<select onchange="setFSR('cat',this.value)">${opts(CATS_REP,f.cat,"Todas")}</select></label>
  </div>
  <div style="margin-top:.6rem">
    <div style="font-size:.8rem;font-weight:600;color:#4a3820;margin-bottom:.35rem">Ciclo ${f.ciclos&&f.ciclos.length>0?`<button class="bs" style="padding:.1rem .5rem;font-size:.7rem;margin-left:.5rem" onclick="limpiarFSR('ciclos')">limpiar</button>`:""}</div>
    <div style="display:flex;flex-wrap:wrap;gap:.5rem">
      ${cilist.map(c=>`<label style="display:flex;align-items:center;gap:.25rem;font-size:.82rem;font-weight:500;background:${(f.ciclos||[]).includes(c)?"#eaf5e0":"#faf8f4"};border:1.5px solid ${(f.ciclos||[]).includes(c)?"#3d6428":"#c8c0b0"};border-radius:6px;padding:.3rem .6rem;cursor:pointer">
        <input type="checkbox" ${(f.ciclos||[]).includes(c)?"checked":""} onchange="toggleFSR('ciclos','${h(c)}')" style="width:auto;cursor:pointer"/>${h(c)}</label>`).join("")}
    </div>
  </div>
  <div style="margin-top:.7rem">
    <div style="font-size:.8rem;font-weight:600;color:#4a3820;margin-bottom:.35rem">Estado ${f.estados&&f.estados.length>0?`<button class="bs" style="padding:.1rem .5rem;font-size:.7rem;margin-left:.5rem" onclick="limpiarFSR('estados')">limpiar</button>`:""}</div>
    <div style="display:flex;flex-wrap:wrap;gap:.5rem">
      ${ESTADOS.map(e=>`<label style="display:flex;align-items:center;gap:.25rem;font-size:.82rem;font-weight:500;background:${(f.estados||[]).includes(e)?"#eaf5e0":"#faf8f4"};border:1.5px solid ${(f.estados||[]).includes(e)?"#3d6428":"#c8c0b0"};border-radius:6px;padding:.3rem .6rem;cursor:pointer">
        <input type="checkbox" ${(f.estados||[]).includes(e)?"checked":""} onchange="toggleFSR('estados','${e==="Selección a IATF"?"Selección a IATF":h(e)}')" style="width:auto;cursor:pointer"/>${e==="Vacias"?"Vacías":h(e)}</label>`).join("")}
    </div>
  </div>
</div>
${camposShow.length===0?`<div class="card"><p class="empty">Sin datos para los filtros seleccionados.</p></div>`:`
${(()=>{
  const totG={};
  for(const est of estadosShow){
    totG[est]=0;
    for(const campo of camposShow)
      for(const cat of catsShow)
        totG[est]+=saldo(campo,cat,est);
  }
  return `
<div class="card" style="border-top:4px solid #2d4a1e">
  <h3>🌐 Total General${f.hasta?" al "+f.hasta.split('-').reverse().join('/'):""}${f.ciclos&&f.ciclos.length>0?" — Ciclos: "+f.ciclos.join(", "):""}</h3>
  <div class="kg">
    ${estadosShow.map(est=>`
    <div class="kp"><div class="kl">${est==="Vacias"?"Vacías":est}</div><div class="kv">${totG[est]}</div></div>`).join("")}
  </div>
</div>`;
})()}
${camposShow.map(campo=>{
  const filas=catsShow.map(cat=>({cat, vals:estadosShow.map(est=>saldo(campo,cat,est))}));
  if(filas.every(fila=>fila.vals.every(v=>v===0))) return "";
  return `
  <div class="card">
    <h3>🏡 ${h(campo)}</h3>
    <div class="tw"><table>
      <thead><tr><th>Categoría</th>${estadosShow.map(est=>`<th>${est==="Vacias"?"Vacías":est}</th>`).join("")}</tr></thead>
      <tbody>
        ${filas.map(fila=>`<tr><td><strong>${h(fila.cat)}</strong></td>${fila.vals.map(v=>`<td><strong>${v}</strong></td>`).join("")}</tr>`).join("")}
        <tr class="tr"><td><strong>TOTAL</strong></td>${estadosShow.map((est,i)=>`<td><strong>${filas.reduce((s,fila)=>s+fila.vals[i],0)}</strong></td>`).join("")}</tr>
      </tbody>
    </table></div>
  </div>`;
}).join("")}
`}`;
}

// ── PRODUCTIVO ──
function renderProd(){
  const f=state.filtProd; const clist=campos(); const cilist=ciclos(); const p=state.par;
  const camposE=f.campo?[f.campo]:[...new Set([
    ...Object.values(state.act).filter(a=>!f.ciclo||a.ciclo===f.ciclo).map(a=>a.campo),
    ...Object.values(state.act).filter(a=>a.tipo==="Traslado de rodeo"&&(!f.ciclo||a.ciclo===f.ciclo)).map(a=>a.trDestino)
  ].filter(Boolean))];
  const gac=(campo,ciclo,tipo,cats)=>Object.values(state.act).filter(a=>a.tipo===tipo&&(!campo||a.campo===campo)&&(!ciclo||a.ciclo===ciclo)&&cats.includes(a.cat)).reduce((s,a)=>s+(a.cant||0),0);
  const gkg=(campo,ciclo)=>Object.values(state.act).filter(a=>a.tipo==="Pesaje"&&(!campo||a.campo===campo)&&(!ciclo||a.ciclo===ciclo)&&["Terneros","Terneras"].includes(a.cat)).reduce((s,a)=>s+(a.kg||0),0);
  const rows=camposE.map(campo=>{
    const entBase=gac(campo,f.ciclo,"Entore",["Vacas","Vaquillonas"])+gac(campo,f.ciclo,"IATF",["Vacas","Vaquillonas"]);
    const preBase=gac(campo,f.ciclo,"Preñez",["Vacas","Vaquillonas"]);
    const cutBase=gac(campo,f.ciclo,"Cut",["Vacas","Vaquillonas"]);
    const dscBase=gac(campo,f.ciclo,"Descarte",["Vacas","Vaquillonas"]);
    const segBase=gac(campo,f.ciclo,"2da oportunidad",["Vacas","Vaquillonas"]);
    // Ajustes por Traslados de rodeo (Opcion 2: mueve cadena completa)
    const traslados=Object.values(state.act).filter(a=>a.tipo==="Traslado de rodeo"&&(!f.ciclo||a.ciclo===f.ciclo));
    let dEnt=0,dPre=0,dCut=0,dDsc=0,dSeg=0;
    for(const t of traslados){
      const tPre=t.trPre||0, tCut=t.trCut||0, tSeg=t.trSeg||0, tDsc=t.trDsc||0;
      const tEnt=tPre+tSeg+tDsc; // todas las trasladadas fueron entoradas
      if(t.campo===campo){ // sale de este campo
        dEnt-=tEnt; dPre-=tPre; dCut-=tCut; dDsc-=tDsc; dSeg-=tSeg;
      }
      if(t.trDestino===campo){ // entra a este campo
        dEnt+=tEnt; dPre+=tPre; dCut+=tCut; dDsc+=tDsc; dSeg+=tSeg;
      }
    }
    const ent=entBase+dEnt;
    const pre=preBase+dPre;
    const cut=cutBase+dCut;
    const dsc=dscBase+dDsc;
    const seg=segBase+dSeg;
    const nacT=Object.values(state.mov).filter(m=>m.tipo==="ingreso"&&m.sub==="Nacimiento"&&m.cat==="Terneros"&&m.campo===campo&&(!f.ciclo||m.ciclo===f.ciclo)).reduce((s,m)=>s+m.cant,0);
    const nacH=Object.values(state.mov).filter(m=>m.tipo==="ingreso"&&m.sub==="Nacimiento"&&m.cat==="Terneras"&&m.campo===campo&&(!f.ciclo||m.ciclo===f.ciclo)).reduce((s,m)=>s+m.cant,0);
    const nac=nacT+nacH;
    const dest=gac(campo,f.ciclo,"Destete",["Terneros","Terneras"]);
    const kgt=gkg(campo,f.ciclo);
    const huboTraslado=(dEnt!==0||dPre!==0||dCut!==0||dDsc!==0||dSeg!==0);
    // Abortos y muertes: contados desde Cambios de estado segun su motivo
    const gMotivo=(motivo)=>Object.values(state.act).filter(a=>
      a.tipo==="Cambio de estado" && a.ceMotivo===motivo &&
      a.campo===campo && (!f.ciclo||a.ciclo===f.ciclo) &&
      ["Vacas","Vaquillonas"].includes(a.cat)
    ).reduce((s,a)=>s+(a.ceCant||0),0);
    const abortos=gMotivo("Aborto");
    const mParto=gMotivo("Muerte al parto");
    const mPost=gMotivo("Muerte post-parto");
    // Bases: Preñez=preñadas/entoradas | Nac,Dest,Kg=/preñadas | Cut=/preñadas | Dsc,2da=/entoradas
    return{campo,ent,pre,nac,nacT,nacH,dest,kgt,cut,dsc,seg,huboTraslado,
      entBase,preBase,abortos,mParto,mPost,
      pPreTacto:pct(preBase,entBase),
      pPre:pct(pre,ent),
      pNac:pct(nac,pre),
      pDest:pct(dest,pre),

      pCut:pct(cut,pre),
      pDsc:pct(dsc,ent),
      pSeg:pct(seg,ent),
      pAborto:pct(abortos,pre),
      pMParto:pct(mParto,pre),
      pMPost:pct(mPost,pre)};
  });
  const fv=(v)=>v!==null&&!isNaN(v)?v.toFixed(1)+"%":"—";
  // ── Total general (suma de todos los campos) ──
  let totRow=null;
  if(!f.campo && rows.length>1){
    const s=k=>rows.reduce((a,r)=>a+(r[k]||0),0);
    const ent=s("ent"),pre=s("pre"),nac=s("nac"),nacT=s("nacT"),nacH=s("nacH"),dest=s("dest"),kgt=s("kgt"),cut=s("cut"),dsc=s("dsc"),seg=s("seg"),abortos=s("abortos"),mParto=s("mParto"),mPost=s("mPost"),entBase=s("entBase"),preBase=s("preBase");
    totRow={campo:"Total General — todos los campos",esTotal:true,ent,pre,nac,nacT,nacH,dest,kgt,cut,dsc,seg,abortos,mParto,mPost,entBase,preBase,
      huboTraslado:false,
      pPreTacto:pct(preBase,entBase),pPre:pct(pre,ent),pNac:pct(nac,pre),pDest:pct(dest,pre),
      kgA:pre>0&&kgt>0?kgt/pre:null,pCut:pct(cut,pre),pDsc:pct(dsc,ent),pSeg:pct(seg,ent),
      pAborto:pct(abortos,pre),pMParto:pct(mParto,pre),pMPost:pct(mPost,pre)};
  }
  const rowsRender=totRow?[totRow,...rows]:rows;
  return `

  </div>

</div>
${rows.length===0?`<div class="card"><p class="empty">Sin datos.</p></div>`:rowsRender.map(r=>`

  <div class="kg">

    <div class="kp"><div class="kl">Nacimientos</div><div class="kv">${r.nac} <small style="font-size:.75rem;color:#666">(${r.nacT}♂ ${r.nacH}♀)</small></div><div class="ks">${sem(r.pNac,p.nacimiento)}</div><div class="km">meta: ${p.nacimiento}% / preñadas</div></div>
    <div class="kp"><div class="kl">Destetados</div><div class="kv">${r.dest}</div><div class="ks">${sem(r.pDest,p.destete)}</div><div class="km">meta: ${p.destete}% / preñadas</div></div>
    <div class="kp"><div class="kl">Kg/animal</div><div class="kv">${r.kgA?r.kgA.toFixed(1):"—"} kg</div><div class="ks">${sem(r.kgA,p.kgAnimal," kg")}</div><div class="km">meta: ${p.kgAnimal}kg / preñadas</div></div>
    <div class="kp"><div class="kl">Kg totales</div><div class="kv">${r.kgt>0?r.kgt.toLocaleString():"—"} kg</div></div>
    <div class="kp"><div class="kl">Cut</div><div class="kv">${r.cut}</div><div class="ks">${semMax(r.pCut,p.cut)}</div><div class="km">max: ${p.cut}% / preñadas</div></div>
    <div class="kp"><div class="kl">Descarte</div><div class="kv">${r.dsc}</div><div class="ks">${semMax(r.pDsc,p.descarte)}</div><div class="km">max: ${p.descarte}% / entoradas</div></div>

    <div class="kp"><div class="kl">Abortos</div><div class="kv">${r.abortos}</div><div class="ks">${semMax(r.pAborto,p.aborto)}</div><div class="km">max: ${p.aborto}% / preñadas</div></div>
    <div class="kp"><div class="kl">Muerte al parto</div><div class="kv">${r.mParto}</div><div class="ks">${semMax(r.pMParto,p.muerteParto)}</div><div class="km">max: ${p.muerteParto}% / preñadas</div></div>

      <tr><td>% Cut (s/preñadas)</td><td>${fv(r.pCut)}</td><td>max ${p.cut}%</td><td>${semMax(r.pCut,p.cut)}</td></tr>

// ── COMPARATIVO ──
function calcKPIsCampoCiclo(campo, ciclo){
  const gac=(tipo,cats)=>Object.values(state.act).filter(a=>a.tipo===tipo&&a.campo===campo&&a.ciclo===ciclo&&cats.includes(a.cat)).reduce((s,a)=>s+(a.cant||0),0);
  const gkg=()=>Object.values(state.act).filter(a=>a.tipo==="Pesaje"&&a.campo===campo&&a.ciclo===ciclo&&["Terneros","Terneras"].includes(a.cat)).reduce((s,a)=>s+(a.kg||0),0);
  const entBase=gac("Entore",["Vacas","Vaquillonas"])+gac("IATF",["Vacas","Vaquillonas"]);
  const preBase=gac("Preñez",["Vacas","Vaquillonas"]);
  const cutBase=gac("Cut",["Vacas","Vaquillonas"]);
  const dscBase=gac("Descarte",["Vacas","Vaquillonas"]);
  const segBase=gac("2da oportunidad",["Vacas","Vaquillonas"]);
  // Ajustes por Traslados de rodeo
  const traslados=Object.values(state.act).filter(a=>a.tipo==="Traslado de rodeo"&&a.ciclo===ciclo);
  let dEnt=0,dPre=0,dCut=0,dDsc=0,dSeg=0;
  for(const t of traslados){
    const tPre=t.trPre||0, tCut=t.trCut||0, tSeg=t.trSeg||0, tDsc=t.trDsc||0;
    const tEnt=tPre+tSeg+tDsc;
    if(t.campo===campo){ dEnt-=tEnt; dPre-=tPre; dCut-=tCut; dDsc-=tDsc; dSeg-=tSeg; }
    if(t.trDestino===campo){ dEnt+=tEnt; dPre+=tPre; dCut+=tCut; dDsc+=tDsc; dSeg+=tSeg; }
  }
  const ent=entBase+dEnt;
  const pre=preBase+dPre;
  const cut=cutBase+dCut;
  const dsc=dscBase+dDsc;
  const seg=segBase+dSeg;
  const nacT=Object.values(state.mov).filter(m=>m.tipo==="ingreso"&&m.sub==="Nacimiento"&&m.cat==="Terneros"&&m.campo===campo&&m.ciclo===ciclo).reduce((s,m)=>s+m.cant,0);
  const nacH=Object.values(state.mov).filter(m=>m.tipo==="ingreso"&&m.sub==="Nacimiento"&&m.cat==="Terneras"&&m.campo===campo&&m.ciclo===ciclo).reduce((s,m)=>s+m.cant,0);
  const nac=nacT+nacH;
  const dest=gac("Destete",["Terneros","Terneras"]);
  const kgt=gkg();
  return{
    ent,pre,nac,nacT,nacH,dest,kgt,cut,dsc,seg,
    pPre:pct(pre,ent), pNac:pct(nac,pre), pDest:pct(dest,pre),
    kgA:pre>0&&kgt>0?kgt/pre:null,
    pCut:pct(cut,pre), pDsc:pct(dsc,ent), pSeg:pct(seg,ent)
  };
}

</div>

${state.comparativos.length<1 ? `<div class="card"><p class="empty">Agregá al menos una serie para comenzar la comparación.</p></div>` :
  datosValid.length<1 ? `<div class="card"><p class="empty">Seleccioná campo y ciclo en cada serie para ver los resultados.</p></div>` : `

<div class="card">
  <h2>📊 Dashboard Comparativo</h2>

  ${indicadores.map(ind=>{
    // Calcular valores y rango

    if(validVals.length===0) return "";

  ${(()=>{
    // Calcular el mejor y peor en términos de cumplimiento
    const ranking = datosValid.map(d=>{
      let cumple=0,total=0;
      for(const ind of indicadores){
        const v=d.kpis[ind.key];
        if(v!==null&&v!==undefined&&!isNaN(v)){
          total++;
          if(ind.tipo==="min"?v>=ind.meta:v<=ind.meta) cumple++;
        }
      }
      return {...d,cumple,total,pct:total>0?(cumple/total*100):0};
    }).sort((a,b)=>b.pct-a.pct);

    if(ranking.length===0) return "<p>Sin datos para conclusiones.</p>";
    const mejor=ranking[0]; const peor=ranking[ranking.length-1];

    // Detectar indicadores con mayor variación
    const variacionInds=[];
    for(const ind of indicadores){
      const vs=datosValid.map(d=>d.kpis[ind.key]).filter(v=>v!==null&&!isNaN(v));
      if(vs.length>=2){
        const mn=Math.min(...vs); const mx=Math.max(...vs);
        const variacion=mx-mn;
        if(variacion>0.1) variacionInds.push({label:ind.label,min:mn,max:mx,variacion,suffix:ind.suffix,base:ind.base});
      }
    }
    variacionInds.sort((a,b)=>b.variacion-a.variacion);
    const topVar=variacionInds.slice(0,3);

    return `
    <div style="display:flex;flex-direction:column;gap:.7rem;font-size:.88rem">
      ${ranking.length>1?`
      <div>🏆 <strong>Mejor desempeño:</strong> ${h(mejor.campo)} · ${h(mejor.ciclo)} con <strong>${mejor.cumple}/${mejor.total}</strong> indicadores cumplidos (${mejor.pct.toFixed(0)}%)</div>
      <div>⚠️ <strong>Menor desempeño:</strong> ${h(peor.campo)} · ${h(peor.ciclo)} con <strong>${peor.cumple}/${peor.total}</strong> indicadores cumplidos (${peor.pct.toFixed(0)}%)</div>
      `:`<div>📊 <strong>${h(ranking[0].campo)} · ${h(ranking[0].ciclo)}</strong>: cumple <strong>${ranking[0].cumple}/${ranking[0].total}</strong> indicadores (${ranking[0].pct.toFixed(0)}%)</div>`}
      ${topVar.length>0?`
      <div style="margin-top:.4rem;padding-top:.7rem;border-top:1px solid #b8d4a0">
        <strong>🔍 Mayores diferencias entre series:</strong>
        <ul style="margin-top:.4rem;padding-left:1.3rem;list-style:disc">
          ${topVar.map(v=>`<li><strong>${v.label}</strong> (s/${v.base}): mín ${v.min.toFixed(1)}${v.suffix} / máx ${v.max.toFixed(1)}${v.suffix} — diferencia ${v.variacion.toFixed(1)}${v.suffix}</li>`).join("")}
        </ul>
      </div>`:""}
    </div>`;
  })()}
</div>
`}`;
}

function exportExcel(){
  const smap={};
  for(const m of Object.values(state.mov)){
    if(!smap[m.campo])smap[m.campo]={};
    if(!smap[m.campo][m.cat])smap[m.campo][m.cat]={ing:0,egr:0,muertes:0,stock:0};
    const r=smap[m.campo][m.cat];
    if(m.tipo==="ingreso"){r.stock+=m.cant;r.ing+=m.cant}else{r.stock-=m.cant;r.egr+=m.cant;if(m.sub==="Muerte")r.muertes+=m.cant}
  }
  const srows=[];
  for(const c of Object.keys(smap))for(const cat of Object.keys(smap[c])){const d=smap[c][cat];srows.push([c,cat,d.ing,d.egr,d.muertes,d.ing>0?(d.muertes/d.ing*100).toFixed(1)+"%":"0%",d.stock])}
  const sheets=[
    {name:"Movimientos",headers:["Fecha","Campo","Categoria","Ciclo","Tipo","Subtipo","Cantidad","Observaciones"],rows:Object.values(state.mov).sort((a,b)=>b.fecha.localeCompare(a.fecha)).map(m=>[m.fecha,m.campo,m.cat,m.ciclo||"",m.tipo,m.sub,m.cant,m.obs||""])},
    {name:"Actividades",headers:["Fecha","Campo","Categoria","Ciclo","Actividad","Cantidad","Kg Totales","Observaciones"],rows:Object.values(state.act).sort((a,b)=>b.fecha.localeCompare(a.fecha)).map(a=>[a.fecha,a.campo,a.cat,a.ciclo||"",a.tipo,a.cant!=null?a.cant:"",a.kg!=null?a.kg:"",a.obs||""])},
    {name:"Stock Resumen",headers:["Campo","Categoria","Ingresos","Egresos","Muertes","% Muertes","Stock"],rows:srows}
  ];
  let wb=`<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="UTF-8"><!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets>${sheets.map(s=>`<x:ExcelWorksheet><x:Name>${s.name}</x:Name><x:WorksheetSource HRef="#${s.name}"/></x:ExcelWorksheet>`).join("")}</x:ExcelWorksheets></x:ExcelWorkbook></xml><![endif]--></head><body>`;
  for(const s of sheets){
    wb+=`<table id="${s.name}"><thead><tr>${s.headers.map(hh=>`<th style="background:#2d4a1e;color:#f0e6c8;font-weight:bold">${hh}</th>`).join("")}</tr></thead><tbody>`;
    for(const row of s.rows)wb+=`<tr>${row.map(v=>`<td>${v}</td>`).join("")}</tr>`;
    wb+=`</tbody></table><br/>`;
  }
  wb+=`</body></html>`;
  const blob=new Blob([wb],{type:"application/vnd.ms-excel;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="StockGanadero_"+new Date().toISOString().slice(0,10)+".xls";a.click();
  toast("✅ Excel exportado");
}

async function restaurarBackup(file){
  if(!confirm("⚠️ Restaurar un backup REEMPLAZARÁ todos los datos actuales (movimientos, actividades, parámetros) con los del archivo. ¿Continuar?"))return;
  const reader=new FileReader();
  reader.onload=async function(ev){
    try{
      const data=JSON.parse(ev.target.result);
      if(data.mov) await set(ref(db,"mov"),data.mov);
      if(data.act) await set(ref(db,"act"),data.act);
      if(data.par) await set(ref(db,"par"),data.par);
      if(data.campos) await set(ref(db,"campos"),data.campos);
      if(data.alertas) await set(ref(db,"alertas"),data.alertas);
      if(data.alertasAct) await set(ref(db,"alertasAct"),data.alertasAct);
      if(data.toros) await set(ref(db,"toros"),data.toros);
      if(data.iatf) await set(ref(db,"iatf"),data.iatf);
      if(data.actividadesCustom) await set(ref(db,"actividadesCustom"),data.actividadesCustom);
      if(data.actBaseOff) await set(ref(db,"actBaseOff"),data.actBaseOff);
      if(data.ventasPlan) await set(ref(db,"ventasPlan"),data.ventasPlan);
      if(data.usuarios) await set(ref(db,"usuarios"),data.usuarios);
      if(data.senasaExtra) await set(ref(db,"senasaExtra"),data.senasaExtra);
      if(data.senasaObs) await set(ref(db,"senasaObs"),data.senasaObs);
      if(data.recordatorios) await set(ref(db,"recordatorios"),data.recordatorios);
      if(data.animales) await set(ref(db,"animales"),data.animales);
      if(data.pesadas) await set(ref(db,"pesadas"),data.pesadas);
      if(data.eventos) await set(ref(db,"eventos"),data.eventos);
      if(data.mangaSesiones) await set(ref(db,"mangaSesiones"),data.mangaSesiones);
      if(data.mangaCatalogo) await set(ref(db,"mangaCatalogo"),data.mangaCatalogo);
      if(data.origenes) await set(ref(db,"origenes"),data.origenes);
      toast("✅ Backup restaurado correctamente");
    }catch(err){
      alert("❌ Error al leer el archivo: "+err.message+"\n\nAsegurate de seleccionar un archivo .json generado con el botón Backup.");
    }
  };
  reader.readAsText(file);
}

function buildModalActs(){

  const nombresCustom = custom.map(([id,c])=>c.nombre.toLowerCase());
  // Actividades heredadas: estan en registros pero no son base ni estan en el nodo custom
  const heredadas = [...new Set(Object.values(state.act).map(a=>a.tipo)
    .filter(t=>t&&!ACT.includes(t)&&!nombresCustom.includes(t.toLowerCase())))].sort();
  return `
  <div class="modal-overlay">
    <div class="modal-box">
      <h2>📋 Administrar Actividades</h2>
      <p>Una sola lista, en orden alfabético. Las marcadas 🔒 Sistema no se pueden desactivar ni renombrar; las 🔒 Cálculos se pueden desactivar pero no renombrar, porque el stock reproductivo y productivo se calculan con esos nombres. El resto se edita y se desactiva libremente (los registros viejos no se tocan).</p>
      <div style="max-height:45vh;overflow-y:auto">
        ${(()=>{
          const items=[
            ...ACT.map(nombre=>({id:null,nombre,base:true,protegida:ACT_PROTEGIDAS.includes(nombre),calc:ACT_CALC.includes(nombre),activo:!(state.actBaseOff&&state.actBaseOff[nombre])})),
            ...custom.map(([id,c])=>({id,nombre:c.nombre,base:false,activo:c.activo,heredada:false})),
            ...heredadas.map(nombre=>({id:null,nombre,base:false,activo:true,heredada:true}))
          ].sort((a,b)=>a.nombre.localeCompare(b.nombre,"es",{sensitivity:"base"}));
          const btn=(txt,fn,title)=>`<button onclick="${fn}" title="${title||""}" style="background:#e8dfc8;border:1px solid #b8a888;border-radius:5px;padding:.2rem .5rem;cursor:pointer;font-size:.75rem">${txt}</button>`;

          <div class="campo-item${c.activo?"":" inactivo"}">
            <span>${h(c.nombre)}${c.protegida?` <small style="color:#a08a60">🔒 Sistema</small>`:c.calc?` <small style="color:#a08a60">🔒 Cálculos</small>`:c.heredada?` <small style="color:#a08a60">(de registros)</small>`:""}</span>
            <span style="display:flex;align-items:center;gap:.4rem">
              ${c.calc||c.protegida?"":btn("✏️ Editar",c.base?`renombrarActividadBase('${h(c.nombre)}')`:`editarActividadCustom('${c.id||""}','${h(c.nombre)}')`,"Cambiar nombre")}
              <span style="font-size:.75rem;color:${c.activo?"#3d6428":"#c84a28"}">${c.activo?"✅ Activa":"❌ Inactiva"}</span>
              ${c.protegida?"":c.base?btn(c.activo?"🚫 Desactivar":"♻️ Reactivar",`toggleActividadBase('${h(c.nombre)}')`):c.heredada?btn("🚫 Desactivar",`desactivarHeredada('${h(c.nombre)}')`):btn(c.activo?"🚫 Desactivar":"♻️ Reactivar",`toggleActividadCustom('${c.id}')`)}
            </span>
          </div>`).join("");
        })()}
      </div>
      <div class="modal-add">
        <input id="nuevaActInput" placeholder="Nombre de la nueva actividad..." onkeydown="if(event.key==='Enter')agregarActividadCustom()"/>

function attachEvents(){
  // nav tabs
  document.querySelectorAll("[data-tab]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      if(state.tab===0)saveFormMov();
      if(state.tab===1)saveFormAct();
      state.tab=parseInt(btn.dataset.tab);state.editMov=null;state.editAct=null;render();
    });
  });
  // header buttons
  const bx=document.getElementById("btnExcel"); if(bx)bx.onclick=exportExcel;
  const bp=document.getElementById("btnPDF"); if(bp)bp.onclick=()=>{toast("🖨️ Abriendo impresion...");setTimeout(()=>window.print(),400);};
  const bb=document.getElementById("btnBackup"); if(bb)bb.onclick=exportBackup;
  const br=document.getElementById("btnRestaurar"); if(br)br.onclick=()=>{const fi=document.getElementById("fileRestaurar");if(fi)fi.click();};
  const fi=document.getElementById("fileRestaurar"); if(fi)fi.onchange=(e)=>{if(e.target.files&&e.target.files[0])restaurarBackup(e.target.files[0]);};
  // mov
  const sm=document.getElementById("submitMov"); if(sm)sm.onclick=doSubmitMov;
  const cm=document.getElementById("cancelMov"); if(cm)cm.onclick=()=>{state.editMov=null;render();};
  // act
  const sa=document.getElementById("submitAct"); if(sa)sa.onclick=doSubmitAct;
  const ca=document.getElementById("cancelAct"); if(ca)ca.onclick=()=>{state.editAct=null;render();};
  // stock
  const dc=document.getElementById("dlCSV"); if(dc)dc.onclick=doDownloadCSV;
  const tc=document.getElementById("togCSV"); if(tc)tc.onclick=()=>{state.showCSV=!state.showCSV;render();};
  // par
  const sp=document.getElementById("savePar"); if(sp)sp.onclick=()=>savePar(state.par);
}

window.hacerLogin=function(){

  const u=Object.values(state.usuarios).find(x=>x&&x.nombre.toLowerCase()===nombre.toLowerCase());
  if(!u){state.loginErr="No encontramos ese nombre. Pedile a un administrador que te dé de alta.";render();return;}

window.guardarIatf=async function(){
  const fecha=document.getElementById("ia_fecha").value;
  const campo=document.getElementById("ia_campo").value;
  const cat=document.getElementById("ia_cat").value;
  const ciclo=document.getElementById("ia_ciclo").value.trim();
  const toroId=document.getElementById("ia_toro").value;
  const rawCaravanas=document.getElementById("ia_caravanas").value;
  if(!fecha||!campo||!cat||!ciclo)return alert("Completá fecha, campo, categoría y ciclo.");
  if(!toroId)return alert("Seleccioná el toro. Si no hay toros cargados, agregalo primero en la sección de arriba.");
  if(!/^\d{4}\/\d{4}$/.test(ciclo))return alert("El ciclo debe tener formato aaaa/aaaa (ej: 2027/2028).");
  const caravanas=[...new Set(rawCaravanas.split(/[\n,;]+/).map(c=>c.trim()).filter(Boolean))];
  if(caravanas.length===0)return alert("Anotá al menos una caravana.");
  // Aviso de duplicados: misma caravana + mismo ciclo ya registrada
  const dups=caravanas.filter(c=>Object.values(state.iatf).some(r=>r.caravana===c&&r.ciclo===ciclo));
  if(dups.length>0&&!confirm("⚠️ Estas caravanas ya tienen IATF registrada en el ciclo "+ciclo+": "+dups.join(", ")+"\n\n¿Cargar igual? (quedarán duplicadas)"))return;
  const regs=caravanas.map(c=>({id:uid(),fecha,campo,cat,ciclo,toroId,caravana:c,resultado:"pendiente"}));
  await Promise.all(regs.map(r=>set(ref(db,`iatf/${r.id}`),r)));
  document.getElementById("ia_caravanas").value="";
  toast("✅ "+regs.length+" inseminación(es) guardada(s)");
};

    const [y,m,d]=iso.split('-').map(Number);
    const dt=new Date(y+1,m-1,d);

  const nuevoDesde=addYear(r.desde);
  const nuevoHasta=addYear(r.hasta);
  if(!confirm("✅ Marcar \""+r.titulo+"\" como cumplido.\n\nSe reprogramará automáticamente para el año próximo:\nDel "+nuevoDesde.split('-').reverse().join('/')+" al "+nuevoHasta.split('-').reverse().join('/')+"\n\n¿Confirmar?"))return;
  await set(ref(db,`recordatorios/${id}`),{...r,desde:nuevoDesde,hasta:nuevoHasta});

window.pdfSenasa=function(){
  const f=state.filtSenasa;
  const hoy=new Date().toISOString().slice(0,10);
  const fechaCorte=f.hasta||hoy;
  const fechaLabel=fechaCorte.split('-').reverse().join('/');
  const clist=campos();
  let cuerpo="";
  for(const campo of clist){
    const renspa=renspaDe(campo);
    const filas=[];
    for(const cat of CATS){
      const key=campo+"|"+cat;
      const auto=stockSenasa(campo,cat,fechaCorte);
      const val=state.senasaOverride[key]!==undefined?state.senasaOverride[key]:auto;
      const obs=obsSenasa(campo,cat);
      if(val>0||obs)filas.push([cat,val,obs]);
    }
    const extras=Object.values(state.senasaExtra).filter(e=>e.campo===campo&&(e.cant>0||e.obs)).sort((a,b)=>a.cat.localeCompare(b.cat));
    for(const e of extras)filas.push([e.cat,e.cant,e.obs||""]);
    if(filas.length===0)continue;
    const total=filas.reduce((s,x)=>s+x[1],0);
    cuerpo+=`
    <div class="campo">
      <div class="ctitle">${campo}${renspa?` — Renspa: ${renspa}`:""}</div>
      <table>
        <thead><tr><th>Categoría</th><th>Cantidad</th><th>Observaciones</th></tr></thead>
        <tbody>
          ${filas.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td class="obs2">${x[2]||""}</td></tr>`).join("")}
          <tr class="tot"><td>TOTAL</td><td>${total}</td><td></td></tr>
        </tbody>
      </table>
    </div>`;
  }
  if(!cuerpo)return alert("No hay existencias para mostrar a esa fecha.");
  const w=window.open("","_blank");
  w.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>Stock SENASA al ${fechaLabel}</title>
  <style>
    body{font-family:Arial,sans-serif;color:#222;padding:24px;max-width:750px;margin:0 auto}
    h1{font-size:1.15rem;margin-bottom:.2rem}
    .sub{color:#666;font-size:.85rem;margin-bottom:1.2rem}
    .campo{margin-bottom:1.4rem;page-break-inside:avoid}
    .ctitle{font-weight:700;font-size:.95rem;background:#e8e4d8;padding:.4rem .6rem;border-radius:4px;margin-bottom:.3rem}
    table{width:100%;border-collapse:collapse;font-size:.85rem}
    th,td{border:1px solid #999;padding:.3rem .55rem;text-align:left}
    th{background:#f0ede4}
    td:nth-child(1),th:nth-child(1){width:160px}
    td:nth-child(2),th:nth-child(2){text-align:right;width:90px}
    .obs2{font-size:.75rem;color:#555}
    .tot td{font-weight:700;background:#f5f2ea}
    .pie{margin-top:2rem;font-size:.75rem;color:#888}
    @media print{body{padding:0}}
  </style></head><body>
  <div style="display:flex;align-items:center;gap:14px;margin-bottom:4px">
    <img src="${LOGO}" alt="Logo" style="width:64px;height:64px;border-radius:8px"/>
    <div>
      <h1 style="margin:0">Declaración de existencias — EL MESTIZO</h1>
      <div class="sub" style="margin:0">Stock al ${fechaLabel} · Generado el ${new Date().toLocaleDateString("es-AR")}</div>
    </div>
  </div>
  <div style="margin-bottom:1.2rem"></div>
  ${cuerpo}
  <div class="pie">Generado con Stock Ganadero</div>
  <script>window.onload=()=>window.print();<\/script>
  </body></html>`);
  w.document.close();
};

const RAZAS=["Angus Colorado","Angus Negro","Careta Colorado","Careta Negro","Hereford","Cruza","Otra"];
const EST_ANIM=[["activo","✅ Activo"],["vendido","💰 Vendido"],["muerto","✝️ Muerto"],["faenado","🔪 Faenado"],["descartado","🚫 Descartado"]];
const GESTACION=283; // días

function limpiarEID(v){ return String(v||"").replace(/\D/g,""); }
function eidCorto(eid){ const e=limpiarEID(eid); return e?e.slice(-6):""; }
function keyAnimal(eid,visual){
  const e=limpiarEID(eid); if(e.length>=12)return e;
  const v=String(visual||"").trim().toUpperCase().replace(/[.#$\[\]\/\s]/g,"_");
  return v?"V_"+v:"";
}
function normTxt(s){ return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim(); }
function fechaISO(d){
  if(d===null||d===undefined||d==="")return "";
  if(d instanceof Date){ if(isNaN(d))return ""; const p=n=>String(n).padStart(2,"0"); return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate()); }
  if(typeof d==="number"){ if(d<20000||d>80000)return ""; const dt=new Date(Date.UTC(1899,11,30)+Math.round(d*86400000)); const p=n=>String(n).padStart(2,"0"); return dt.getUTCFullYear()+"-"+p(dt.getUTCMonth()+1)+"-"+p(dt.getUTCDate()); }
  const s=String(d).trim(); let m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/); if(m)return m[3]+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0");
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m)return m[0]; return "";
}
function horaDe(d){
  if(d instanceof Date&&!isNaN(d)){const p=n=>String(n).padStart(2,"0");return p(d.getHours())+":"+p(d.getMinutes())+":"+p(d.getSeconds());}
  if(typeof d==="number"){ const frac=d-Math.floor(d); const secs=Math.round(frac*86400); const p=n=>String(n).padStart(2,"0"); return p(Math.floor(secs/3600))+":"+p(Math.floor(secs%3600/60))+":"+p(secs%60); }
  const m=String(d||"").match(/(\d{1,2}):(\d{2})(?::(\d{2}))?/); return m?m[1].padStart(2,"0")+":"+m[2]+":"+(m[3]||"00"):"00:00:00";
}
function fmtF(iso){ if(!iso)return "—"; const [y,m,d]=String(iso).split("-"); return d+"/"+m+"/"+y; }
function diasEntre(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }
function hoyISO(){ return new Date().toISOString().slice(0,10); }
function sinUndef(o){ const r={}; for(const k of Object.keys(o)){ if(o[k]!==undefined)r[k]=o[k]; } return r; }

function catHook(cat,sexo){
  const c=normTxt(cat), s=normTxt(sexo);
  const hembra=s.startsWith("h")||s==="f";
  if(c.startsWith("terner"))return hembra?"Terneras":"Terneros";
  if(c.startsWith("novillit"))return "Novillitos";
  if(c.startsWith("novill"))return "Novillos";
  if(c.startsWith("vaquill"))return "Vaquillonas";
  if(c.startsWith("vaca"))return "Vacas";
  if(c.startsWith("torit"))return "Toritos";
  if(c.startsWith("toro"))return "Toros";
  const f=CATS.find(x=>normTxt(x)===c); return f||(hembra?"Terneras":"Terneros");
}
function sexoHook(sexo,cat){
  const s=normTxt(sexo);
  if(s.startsWith("h")||s==="f")return "Hembra"; if(s.startsWith("m"))return "Macho";
  return ["Vacas","Vaquillonas","Terneras"].includes(cat)?"Hembra":"Macho";
}
function campoHook(prod){
  const base=String(prod||"").split(" - ")[0].trim(); if(!base)return "";
  const cl=campos(); const nb=normTxt(base);
  return cl.find(c=>normTxt(c)===nb)||cl.find(c=>nb.includes(normTxt(c))||normTxt(c).includes(nb))||base;
}
function pesadasDe(key){ return Object.values(state.pesadas).filter(p=>p&&p.animal===key).sort((a,b)=>((a.fecha||"")+(a.hora||"")).localeCompare((b.fecha||"")+(b.hora||""))); }
function adpvDe(ps){ if(ps.length<2)return null; const a=ps[0],b=ps[ps.length-1]; const d=diasEntre(a.fecha,b.fecha); return d>0?(b.peso-a.peso)/d:null; }
function iatfDe(a){
  const ids=[a.visual,a.caravana,a.key].filter(Boolean).map(x=>normTxt(x));
  return Object.values(state.iatf).filter(r=>r&&ids.includes(normTxt(r.caravana))).sort((x,y)=>(x.fecha||"").localeCompare(y.fecha||""));
}
function buscarAnimalRef(txt){
  if(!txt)return null; const t=String(txt).trim(); if(state.animales[t])return state.animales[t];
  const d=limpiarEID(t); const nt=normTxt(t);

}

function hijosDe(a){ return Object.values(state.animales).filter(x=>x&&x.madre&&x.key!==a.key&&(()=>{const m=buscarAnimalRef(x.madre);return m&&m.key===a.key;})()); }
function sugerirPadre(a){
  const madre=buscarAnimalRef(a.madre); if(!madre)return {txt:"",motivo:"Primero cargá la madre."};
  const regs=iatfDe(madre); if(regs.length===0){ const r=a.fechaNac?torosEntoreDe(madre,a.fechaNac):null; return {txt:(r&&r.toros.length===1)?r.toros[0]:"",motivo:"La madre no tiene IATF registrada → servicio natural. "+(a.fechaNac?entoreInfo(madre,a.fechaNac):"Cargá la fecha de nacimiento para buscar el entore.")}; }
  if(!a.fechaNac)return {txt:"",motivo:"Cargá la fecha de nacimiento para calcular la ventana de gestación."};
  const nac=new Date(a.fechaNac);
  const enVentana=regs.filter(r=>{ if(!r.fecha)return false; const d=diasEntre(r.fecha,a.fechaNac); return d>=GESTACION-20&&d<=GESTACION+15; });
  if(enVentana.length>0){ const r=enVentana[enVentana.length-1]; const t=state.toros[r.toroId]; return {txt:t?t.nombre:"",motivo:"IATF del "+fmtF(r.fecha)+" ("+diasEntre(r.fecha,a.fechaNac)+" días antes del parto)"+(r.resultado==="vacia"?" — ojo: tacto la dio VACÍA":"")}; }
  { const r=torosEntoreDe(madre,a.fechaNac); return {txt:(r&&r.toros.length===1)?r.toros[0]:"",motivo:"Hay IATF pero fuera de la ventana de gestación → repaso con toro a campo. "+entoreInfo(madre,a.fechaNac)}; }
}
function torosEntoreDe(madre,fechaNac){
  // 1) entore registrado por caravana en la manga (evento de la madre)
  const evs=eventosDe(madre.key).filter(e=>e.tipo==="Entore"&&e.fecha&&(()=>{const d=diasEntre(e.fecha,fechaNac);return d>=GESTACION-15&&d<=GESTACION+120;})());
  if(evs.length){ const nombres=evs[evs.length-1].producto.split(", ").filter(Boolean); if(nombres.length)return {fuente:"entore por caravana del "+fmtF(evs[evs.length-1].fecha),toros:nombres}; }
  // 2) entore por lote del campo/categoría
  const ent=Object.values(state.act).filter(x=>x&&x.tipo==="Entore"&&x.campo===madre.campo&&x.fecha&&(!x.cat||!madre.cat||x.cat===madre.cat)&&(()=>{const d=diasEntre(x.fecha,fechaNac);return d>=GESTACION-15&&d<=GESTACION+120;})());
  if(ent.length){ const a=ent[ent.length-1]; const nombres=(a.toros||[]).map(id=>state.toros[id]&&state.toros[id].nombre).filter(Boolean); return {fuente:"entore en "+madre.campo+" del "+fmtF(a.fecha),toros:nombres}; }
  return null;
}
function entoreInfo(madre,fechaNac){
  const r=torosEntoreDe(madre,fechaNac);
  if(r&&r.toros.length===1)return "Servicio natural: "+r.fuente+" con "+r.toros[0]+".";
  if(r&&r.toros.length>1)return "Servicio natural: "+r.fuente+". Toros posibles: "+r.toros.join(", ")+". Elegí uno en el campo Padre.";
  if(r)return "Servicio natural: "+r.fuente+", sin toros cargados en ese entore.";
  const toros=Object.values(state.toros).filter(t=>t&&t.activo!==false&&(t.uso||"")!=="Semen (IATF)").map(t=>t.nombre);
  return "Sin entore registrado en "+(madre.campo||"su campo")+" para esa fecha."+(toros.length?" Toros de campo: "+toros.join(", ")+".":"");
}

function procesarLecturaBaston(txt){
  const raw=String(txt||"").trim(); const d=limpiarEID(raw); if(!raw){ return; }
  const m=d.match(/\d{15}$/); const eid=m?m[0]:(/[A-Za-z]/.test(raw)?raw.toUpperCase():d);
  let a=state.animales[eid]||null;
  if(!a&&/[A-Za-z]/.test(raw))a=buscarAnimalRef(raw)||null;
  if(!a)a=Object.values(state.animales).find(x=>x&&limpiarEID(x.caravana).endsWith(eid)&&eid.length>=4)||null;

window.conectarBaston=async function(){
  if(!("serial" in navigator)){ alert("Este navegador no permite conexión directa. Usá Chrome en PC, o configurá el bastón en modo teclado (HID) y leé en el campo de lectura."); return; }
  try{
    const port=await navigator.serial.requestPort();
    await port.open({baudRate:9600});
    state.serialPort=port; toast("🔌 Bastón conectado. Pasalo por una caravana."); render();
    const decoder=new TextDecoderStream(); port.readable.pipeTo(decoder.writable); const reader=decoder.readable.getReader();
    let buf="";
    while(true){
      const {value,done}=await reader.read(); if(done)break; buf+=value;
      let i; while((i=buf.search(/[\r\n]/))>=0){ const line=buf.slice(0,i).trim(); buf=buf.slice(i+1); if(line)procesarLecturaBaston(line); }
      if(buf.length>200)buf=buf.slice(-50);
    }
  }catch(e){ state.serialPort=null; if(e.name!=="NotFoundError")alert("No se pudo conectar el bastón: "+e.message); render(); }
};

// ── IMPORTACIÓN HOOK ──
function colVal(row,names){
  const keys=Object.keys(row);
  for(const n of names){ const nn=normTxt(n); const k=keys.find(k=>normTxt(k)===nn)||keys.find(k=>normTxt(k).startsWith(nn)); if(k!==undefined&&row[k]!==""&&row[k]!==null&&row[k]!==undefined)return row[k]; }
  return "";
}
window.importarHookArchivo=function(file){
  if(!file)return;
  if(typeof XLSX==="undefined"){ alert("No se pudo cargar el lector de Excel (hace falta internet la primera vez). Reintentá en un momento."); return; }
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const wb=XLSX.read(e.target.result,{type:"array",cellDates:true});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{defval:"",raw:true});
      procesarHook(rows,file.name);
    }catch(err){ alert("❌ No pude leer el archivo: "+err.message); }
  };
  reader.readAsArrayBuffer(file);
};
function procesarHook(rows,fname){
  const sesion=String(fname||"Hook").replace(/\.(xlsx|xls|csv)$/i,"");
  const nuevos=[],exist=[],pesN=[]; let pesDup=0,sinCaravana=0,sinPeso=0;
  const camposMap={},cats={},razas={}; const vistos={};
  for(const r of rows){
    const eid=limpiarEID(colVal(r,["Caravana","EID","RFID","Caravana electronica"]));
    if(eid.length<12){ sinCaravana++; continue; }
    const fecha=colVal(r,["Fecha"]); const fISO=fechaISO(fecha), hora=horaDe(fecha);
    const prod=colVal(r,["Productor","Productor ganadero","Establecimiento","Campo"]);
    const campo=campoHook(prod); if(prod){ if(!camposMap[prod])camposMap[prod]={campo,n:0}; camposMap[prod].n++; }
    const catRaw=colVal(r,["Categoria","Categoría"]); const sexoRaw=colVal(r,["Sexo"]);
    const cat=catHook(catRaw,sexoRaw); const sexo=sexoHook(sexoRaw,cat); cats[cat]=(cats[cat]||0)+1;
    const raza=String(colVal(r,["Raza"])||"").trim(); if(raza)razas[raza]=(razas[raza]||0)+1;
    const cur=state.animales[eid];
    const nac=fechaISO(colVal(r,["Fecha de nacimiento","Nacimiento","Fecha nac"]));
    const pesoNacRaw=parseFloat(colVal(r,["Peso al nacer","Peso nac"]));
    const a=sinUndef({
      key:eid,caravana:eid,
      visual:(cur&&cur.visual)||String(colVal(r,["SENASA","Caravana visual","Visual"])||"").trim().toUpperCase(),
      campo:campo||(cur&&cur.campo)||"",cat,sexo,raza,
      corral:String(colVal(r,["Corral"])||"").trim(),tropa:String(colVal(r,["Tropa"])||"").trim(),
      ingreso:(cur&&cur.ingreso)||fechaISO(colVal(r,["Ingreso"]))||fISO,
      fechaNac:(cur&&cur.fechaNac)||nac||"",pesoNac:(cur&&cur.pesoNac)||(pesoNacRaw>0?pesoNacRaw:""),
      madre:(cur&&cur.madre)||"",padre:(cur&&cur.padre)||"",
      estado:(cur&&cur.estado)||"activo",obs:(cur&&cur.obs)||String(colVal(r,["Observacion","Observación"])||"").trim(),
      origen:(cur&&cur.origen)||"hook",sesion,
      ciclo:(cur&&cur.ciclo)||cicloDe({fechaNac:nac,corral:String(colVal(r,["Corral"])||""),ingreso:fechaISO(colVal(r,["Ingreso"]))||fISO})
    });
    if(!vistos[eid]){ vistos[eid]=true; (cur?exist:nuevos).push(a); }
    const peso=parseFloat(colVal(r,["Peso"]));
    if(peso>0&&fISO){ const pid=eid+"_"+fISO+"_"+hora.replace(/:/g,""); if(state.pesadas[pid]||pesN.some(p=>p.id===pid))pesDup++; else pesN.push({id:pid,animal:eid,fecha:fISO,hora,peso,origen:"hook",sesion}); }
    else sinPeso++;
  }
  if(nuevos.length+exist.length===0){ alert("No encontré caravanas electrónicas de 15 dígitos en el archivo. Revisá que sea la exportación de la sesión de Hook (columna Caravana)."); return; }
  state.importAnim={sesion,total:rows.length,nuevos,exist,pesN,pesDup,sinCaravana,sinPeso,campos:camposMap,cats,razas,actualizar:true};
  render();
}

  for(const a of p.exist){ const c=merged[a.key]||{}; merged[a.key]=sinUndef(p.actualizar?{...c,campo:a.campo||c.campo,cat:a.cat||c.cat,sexo:a.sexo||c.sexo,raza:a.raza||c.raza,corral:a.corral||c.corral,tropa:a.tropa||c.tropa,fechaNac:c.fechaNac||a.fechaNac,pesoNac:c.pesoNac||a.pesoNac,ingreso:c.ingreso||a.ingreso,sesion:a.sesion}:{...c,sesion:c.sesion||a.sesion}); }

function parsearFilaTrat(campos){
  // campos: array de strings de una fila (pegado o excel). Heurística por contenido.
  let fecha="",hora="",eid="",producto="",dosis="",enfermedad=""; const otros=[];
  // unir "1" + "kg" cuando el pegado vino separado por espacios simples
  const unidos=[]; for(let i=0;i<campos.length;i++){ const c=String(campos[i]==null?"":campos[i]).trim(); const n=String(campos[i+1]==null?"":campos[i+1]).trim();
    if(/^\d+([.,]\d+)?$/.test(c)&&/^(kg|g|gr|ml|cc|mg|l|lt|dosis|un|u)$/i.test(n)){ unidos.push(c+" "+n); i++; } else unidos.push(c); }
  campos=unidos;
  for(let c of campos){ c=String(c==null?"":c).trim(); if(!c||c==="-")continue;
    const d=c.replace(/\D/g,"");
    if(!eid&&d.length===15&&/^\d{15}$/.test(c.replace(/\s/g,""))){ eid=d; continue; }
    if(!fecha&&/^\d{1,2}[\/\-]\d{1,2}[\/\-]\d{4}/.test(c)){ fecha=fechaISO(c); hora=horaDe(c); continue; }
    if(!fecha&&/^\d{4}-\d{2}-\d{2}/.test(c)){ fecha=fechaISO(c); hora=horaDe(c); continue; }
    if(!dosis&&/^\d+([.,]\d+)?\s*(kg|g|gr|ml|cc|mg|l|lt|dosis|un|u)\b/i.test(c)){ dosis=c; continue; }
    otros.push(c);
  }
  if(!producto&&otros.length){ producto=otros.shift(); }
  if(!enfermedad&&otros.length){ enfermedad=otros.find(o=>!/^\d+$/.test(o)&&normTxt(o)!==normTxt(producto))||""; }
  return {fecha,hora,eid,producto,dosis,enfermedad};
}
function armarPrevTrat(filas){
  const prev=[]; const vistos={};
  for(const campos of filas){
    const r=parsearFilaTrat(campos); if(!r.eid&&!r.producto)continue;
    const a=r.eid?state.animales[r.eid]:null; const key=a?a.key:null;
    const id=key?idEvento(key,r.fecha,r.hora,r.producto):"";
    const dup=!!(id&&(state.eventos[id]||vistos[id])); if(id)vistos[id]=true;
    prev.push({...r,key,id,dup});
  }
  return prev;
}
window.revisarTrat=function(){
  const el=document.getElementById("tr_txt"); const txt=(el?el.value:state.trTxt)||""; state.trTxt=txt;
  const filas=[];
  for(const raw of txt.split(/\n/)){ const l=raw.trim(); if(!l)continue; if(/fecha de tratamiento/i.test(l))continue;
    let campos=l.includes("\t")?l.split("\t"):l.split(/\s{2,}/);
    if(campos.length<3){ // pegado en una sola línea con espacios simples: separar por patrones
      const m=l.match(/^(\d{1,2}\/\d{1,2}\/\d{4}(?:,?\s*\d{1,2}:\d{2}(?::\d{2})?)?)\s+(.+?)\s+(\d{15})\s+(.*)$/);
      if(m){ campos=[m[1],m[2],m[3],...m[4].split(/\s+/)]; }
    }
    filas.push(campos);
  }
  if(filas.length===0){ toast("Pegá la tabla primero"); return; }
  state.trPrev=armarPrevTrat(filas); render();
};

(function(){ let buf="", t=null;
  document.addEventListener("keydown",e=>{
    if(!state.manga.on)return; const el=document.activeElement;
    if(el&&(el.tagName==="INPUT"||el.tagName==="TEXTAREA"||el.tagName==="SELECT"))return;
    if(/^\d$/.test(e.key)){ buf+=e.key; e.preventDefault(); clearTimeout(t); t=setTimeout(()=>{buf="";},1500); if(buf.length>=15){ procesarLecturaBaston(buf); buf=""; } }
    else if(e.key==="Enter"&&buf){ e.preventDefault(); procesarLecturaBaston(buf); buf=""; }
  });
})();


window.setFAnimModoPesaje=function(v){ state.tab=MANGA_TAB; render(); };
window.mangaCfg=function(v){ state.manga.cfg=!!v; if(!v&&!state.manga.campo){alert("Elegí el campo donde estamos trabajando.");state.manga.cfg=true;} render(); if(!state.manga.cfg)enfocar("bl_eid"); guardarSesionManga(); };
window.setFAnimMg=function(k,v){ state.manga[k]=v; if(["altaCat","pesar","campo"].includes(k))render(); };
function togList(arr,v){ const i=arr.indexOf(v); if(i>=0)arr.splice(i,1); else arr.push(v); return arr; }
async function catalogoAdd(kind,v){ v=String(v||"").trim(); if(!v)return; const c=state.mangaCatalogo; if(!c[kind].includes(v)){ c[kind]=[...c[kind],v]; await set(ref(db,"mangaCatalogo"),c); } }
async function catalogoAddProd(nombre){ nombre=String(nombre||"").trim(); if(!nombre)return; if(catalogoProd().some(p=>p.nombre===nombre))return; state.mangaCatalogo.productos=[...(state.mangaCatalogo.productos||[]),{nombre,categoria:"",dosis:""}]; await set(ref(db,"mangaCatalogo"),state.mangaCatalogo); }
function mangaTogCore(T,M,k,v,extra){
  // T: objeto con tipos/productos/prodDosis a modificar. M: sesión (para listas disponibles)
  if(k==="tipo")togList(T.tipos,v);
  else if(k==="prod")togList(T.productos,v);
  else if(k==="pdosis"){ let d=String(extra||"").trim(); if(/^\d+([.,]\d+)?$/.test(d))d=d+" cc"; T.prodDosis={...(T.prodDosis||{}),[v]:d}; return false; }
  else if(k==="addTipo"){ if(v==="__nueva"){ const n=prompt("Nombre de la nueva actividad (queda también en la pestaña Actividades):"); if(!n)return false; v=n.trim(); if(!actividadesAll(true).some(a=>a.toLowerCase()===v.toLowerCase())){ const id=uid(); set(ref(db,"actividadesCustom/"+id),{id,nombre:v,activo:true}); state.actividadesCustom={...(state.actividadesCustom||{}),[id]:{id,nombre:v,activo:true}}; } } if(!v)return false; if(!M.tiposDisp.includes(v))M.tiposDisp.push(v); if(!T.tipos.includes(v))T.tipos.push(v); }
  else if(k==="quitarTipo"){ M.tiposDisp=M.tiposDisp.filter(x=>x!==v); T.tipos=T.tipos.filter(x=>x!==v); if(M.over)M.over.tipos=M.over.tipos.filter(x=>x!==v); }
  else if(k==="addProd"){ if(v==="__nuevo"){ const n=prompt("Nombre del nuevo producto:"); if(!n)return false; v=n.trim(); catalogoAddProd(v); } if(!v)return false; if(!M.prodsDisp.includes(v))M.prodsDisp.push(v); if(!T.productos.includes(v))T.productos.push(v); if(!(T.prodDosis||{})[v]){ const d=prodInfo(v).dosis; if(d)T.prodDosis={...(T.prodDosis||{}),[v]:d}; } }
  else if(k==="quitarProd"){ M.prodsDisp=M.prodsDisp.filter(x=>x!==v); T.productos=T.productos.filter(x=>x!==v); if(M.over)M.over.productos=M.over.productos.filter(x=>x!==v); }
  return true;
}
window.mangaTog=function(k,v,extra){ const M=state.manga; const T={tipos:M.tipos,productos:M.productos,prodDosis:M.prodDosis}; const r=mangaTogCore(T,M,k,v,extra); M.tipos=T.tipos; M.productos=T.productos; M.prodDosis=T.prodDosis; if(r)render(); };
window.mangaTogOver=function(k,v,extra){ const M=state.manga; if(!M.over)M.over={tipos:[...M.tipos],productos:[...M.productos],prodDosis:{...M.prodDosis}}; const r=mangaTogCore(M.over,M,k,v,extra); if(r)render(); };
window.togToroEntore=function(id){ const tgt=state.editAct||state.formAct; tgt.toros=[...(tgt.toros||[])]; const i=tgt.toros.indexOf(id); if(i>=0)tgt.toros.splice(i,1); else tgt.toros.push(id); render(); };

window.mangaSexoRapido=async function(cat){ const M=state.manga; const a=M.animal?state.animales[M.animal]:null; if(!a||a.cat===cat)return; const n={...a,cat,sexo:sexoDeCat(cat),modificado:hoyISO()}; state.animales[a.key]=n; await set(ref(db,"animales/"+a.key),n); toast("✔ "+nombreAnimal(n)+" → "+cat); render(); };
window.mangaRazaRapida=async function(r){ const M=state.manga; const a=M.animal?state.animales[M.animal]:null; r=String(r||"").trim(); if(!a||!r||a.raza===r)return; const n={...a,raza:r,modificado:hoyISO()}; state.animales[a.key]=n; await set(ref(db,"animales/"+a.key),n); toast("✔ "+nombreAnimal(n)+" · "+r); render(); };
window.mangaTacto=function(v){ state.manga.tactoRes=v; render(); };
window.mangaOk=async function(){
  const M=state.manga; const a=M.animal?state.animales[M.animal]:null; if(!a)return;
  const fecha=M.fecha||hoyISO(); const ids={pesadas:[],eventos:[]}; const partes=[];
  const acts=mangaActsDe(M); const peso=parseFloat(M.peso);
  if(acts.tipos.includes("Tacto")&&!M.tactoRes){ alert("Marcá el resultado del tacto (preñada, vacía, etc.)."); return; }
  if(M.pesar&&peso>0){ const id=a.key+"_"+fecha+"_"+Date.now().toString(36); const p={id,animal:a.key,fecha,hora:mangaHora(),peso,origen:"manual",sesion:"manga"}; state.pesadas[id]=p; await set(ref(db,"pesadas/"+id),p); ids.pesadas.push(id); partes.push(peso+" kg"); }
  else if(M.pesar&&!confirm("No cargaste peso. ¿Registrar igual sin peso?"))return;
  const torosN=(M.torosEntore||[]).map(id=>state.toros[id]&&state.toros[id].nombre).filter(Boolean);
  const lista=acts.tipos.map(t=>({tipo:t,producto:t==="Tacto"?M.tactoRes:t==="Entore"?torosN.join(", "):acts.productos.join(", "),dosis:(t==="Tacto"||t==="Entore")?"":acts.productos.map(p=>(acts.prodDosis||{})[p]?p+" "+acts.prodDosis[p]:"").filter(Boolean).join("; ")}));
  if(lista.length){ ids.eventos=await mangaRegistrarActs(a,lista); partes.push(acts.tipos.join(" + ")+(acts.productos.length?" ("+prodTexto(acts)+")":"")); }
  if(acts.tipos.includes("Entore")&&!acts.tipos.includes("Tacto")){ ids.estadoRepAnterior=a.estadoRep||""; const n={...a,estadoRep:"entorada"}; state.animales[a.key]=n; await set(ref(db,"animales/"+a.key),n); }
  if(acts.tipos.includes("Tacto")){ ids.estadoRepAnterior=a.estadoRep||""; const n={...a,estadoRep:M.tactoRes,fechaTacto:fecha}; state.animales[a.key]=n; await set(ref(db,"animales/"+a.key),n); M._tactos={...(M._tactos||{}),[a.key]:M.tactoRes}; partes.push("tacto: "+M.tactoRes); }
  mangaLog(a,partes.join(" · ")||"pasó por la manga",ids);
  toast("✔ "+nombreAnimal(a)+(partes.length?": "+partes.join(" · "):""));
  M.animal=null; M.peso=""; M.over=null; M.tactoRes=""; M.extra=M.catOpen=M.bajaOpen=false; render(); enfocar("bl_eid"); guardarSesionManga();
};
