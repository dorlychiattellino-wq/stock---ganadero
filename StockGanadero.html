<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Stock Ganadero</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stock Ganadero">
<meta name="theme-color" content="#2d4a1e">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f5f0e8;color:#2a1f0e;min-height:100vh;overflow-x:hidden}
header{background:linear-gradient(135deg,#2d4a1e,#3d6428,#1a2e12);color:#e8dfc8;padding:1rem 1.5rem;display:flex;align-items:center;gap:1rem;box-shadow:0 3px 12px rgba(0,0,0,.3);flex-wrap:wrap}
header img{height:50px;width:50px;object-fit:contain;border-radius:4px;flex-shrink:0}
.htitulo{flex:1}
header h1{font-size:1.4rem;color:#f0e6c8;margin-bottom:2px}
header p{font-size:.8rem;color:#a8c890}
.hbtns{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.hbtn{display:flex;align-items:center;gap:.35rem;background:rgba(255,255,255,.13);color:#f0e6c8;border:1px solid rgba(255,255,255,.25);border-radius:7px;padding:.38rem .8rem;font-size:.78rem;font-weight:600;cursor:pointer;white-space:nowrap;transition:background .15s}
.hbtn:hover{background:rgba(255,255,255,.23)}
.hbtn.grn{background:rgba(46,139,60,.55);border-color:rgba(46,180,70,.4)}
.hbtn.grn:hover{background:rgba(46,139,60,.8)}
.hbtn.blu{background:rgba(30,90,180,.5);border-color:rgba(80,140,220,.4)}
.hbtn.blu:hover{background:rgba(30,90,180,.75)}
.hbtn.org{background:rgba(180,100,20,.55);border-color:rgba(220,150,50,.4)}
.hbtn.org:hover{background:rgba(180,100,20,.8)}
.sync-bar{background:#1a2e12;border-bottom:1px solid #3d6428;padding:.4rem 1.5rem;font-size:.78rem;color:#a8c890;display:flex;align-items:center;gap:.6rem}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#22c55e;display:inline-block;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.sync-dot.offline{background:#f87171;animation:none}
nav{background:#2d4a1e;display:flex;overflow-x:auto;padding:0 .5rem;gap:0}
nav button{background:none;border:none;border-bottom:3px solid transparent;color:#8fb878;padding:.65rem .9rem;cursor:pointer;font-size:.8rem;white-space:nowrap;font-weight:600;transition:all .15s}
nav button:hover{color:#c8e8a8}
nav button.active{color:#f0e6c8;border-bottom-color:#8fb878;background:rgba(255,255,255,.07)}
main{max-width:1100px;margin:0 auto;padding:1.2rem 1rem 3rem;box-sizing:border-box}
.card{background:#fff;border-radius:10px;padding:1.4rem;margin-bottom:1.1rem;box-shadow:0 2px 8px rgba(45,74,30,.08);border:1px solid #ddd8cc;overflow:hidden}
h2{font-size:1.05rem;color:#2d4a1e;margin-bottom:.9rem;font-weight:700}
h3{font-size:.95rem;color:#2d4a1e;margin-bottom:.9rem;font-weight:700}
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:.7rem;margin-bottom:.8rem}
.fg label{display:flex;flex-direction:column;gap:.25rem;font-size:.8rem;font-weight:600;color:#4a3820;min-width:0}
.fg .s2{grid-column:span 2}
.fg input,.fg select{border:1.5px solid #c8c0b0;border-radius:6px;padding:.4rem .55rem;font-size:.85rem;font-family:inherit;background:#faf8f4;color:#2a1f0e;width:100%;min-width:0;box-sizing:border-box}
.fg input:focus,.fg select:focus{outline:none;border-color:#3d6428}
@media(max-width:700px){
  .fg{grid-template-columns:1fr 1fr}
  .fg .s2, .fg label[style*="span 2"]{grid-column:1 / -1}
}
.br{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.4rem}
.bp{background:#2d4a1e;color:#f0e6c8;border:none;border-radius:7px;padding:.5rem 1.1rem;font-size:.85rem;font-weight:600;cursor:pointer}
.bp:hover{background:#3d6428}
.bs{background:#e8dfc8;color:#2d4a1e;border:1.5px solid #b8a888;border-radius:7px;padding:.5rem 1.1rem;font-size:.85rem;font-weight:600;cursor:pointer}
.bi{background:none;border:none;cursor:pointer;font-size:.95rem;padding:.15rem}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.81rem}
th{background:#2d4a1e;color:#e8dfc8;padding:.45rem .65rem;text-align:left;font-weight:600;white-space:nowrap}
td{padding:.4rem .65rem;border-bottom:1px solid #e8e0d0;vertical-align:middle}
tr:hover td{background:#f5f0e8}
.ri td{border-left:3px solid #4a8c28}
.re td{border-left:3px solid #c84a28}
.tr td{background:#f0ebe0;font-weight:700;border-top:2px solid #b8a888}
.empty{text-align:center;color:#888;padding:1.5rem;font-style:italic}
.obs{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#666;font-size:.78rem}
.ni{color:#2d6a10;font-weight:600}
.ne{color:#c84a28;font-weight:600}
.bi2{background:#d4f0c0;color:#2a5c10;border-radius:4px;padding:.12rem .45rem;font-size:.76rem;font-weight:700}
.be2{background:#fad0c0;color:#8c2810;border-radius:4px;padding:.12rem .45rem;font-size:.76rem;font-weight:700}
.ba{background:#d0e8f8;color:#185888;border-radius:4px;padding:.12rem .45rem;font-size:.76rem;font-weight:700}
.bc{background:#e8d4a8;color:#5a3c10;border-radius:4px;padding:.18rem .55rem;font-size:.8rem;font-weight:700;margin-left:.4rem}
.sg{color:#2a6010;font-weight:700}
.sr{color:#c82010;font-weight:700}
.sg2{color:#888}
.hint{font-size:.8rem;color:#6a5840;margin-bottom:.8rem;font-style:italic}
pre.csvpre{background:#1a1a1a;color:#a0e060;padding:.9rem;border-radius:6px;font-size:.72rem;overflow-x:auto;margin-top:.9rem;line-height:1.5;white-space:pre}
.kg{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:.7rem;margin-bottom:.5rem}
.kp{background:#f5f0e8;border-radius:8px;padding:.8rem .9rem;border:1px solid #ddd8cc}
.kl{font-size:.72rem;font-weight:700;color:#5a4020;text-transform:uppercase;letter-spacing:.03em;margin-bottom:.25rem}
.kv{font-size:1.3rem;color:#2d4a1e;font-weight:700}
.ks{margin:.15rem 0;font-size:.88rem}
.km{font-size:.7rem;color:#888}
.pc{border-top:4px solid #3d6428}
.rw{display:flex;align-items:center;gap:.6rem;margin-top:.25rem}
.rw input[type=range]{flex:1;accent-color:#3d6428}
.rv{font-size:.95rem;font-weight:700;color:#2d4a1e;min-width:55px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1000;display:flex;align-items:center;justify-content:center;padding:1rem}
.modal-box{background:#fff;border-radius:12px;padding:1.5rem;width:100%;max-width:420px;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-box h2{color:#2d4a1e;margin-bottom:.4rem;font-size:1.1rem}
.modal-box p{font-size:.8rem;color:#888;margin-bottom:1rem}
.campo-item{display:flex;align-items:center;justify-content:space-between;padding:.55rem .7rem;border-radius:6px;cursor:pointer;border:2px solid transparent;margin-bottom:.3rem;font-size:.9rem}
.campo-item:hover{background:#f5f0e8}
.campo-item.sel{border-color:#3d6428;background:#eaf5e0}
.campo-item.inactivo{opacity:.45;text-decoration:line-through}
.modal-add{display:flex;gap:.5rem;margin-top:.8rem}
.modal-add input{flex:1;border:1.5px solid #c8c0b0;border-radius:6px;padding:.45rem .6rem;font-size:.85rem;font-family:inherit}
.modal-add input:focus{outline:none;border-color:#3d6428}
.modal-footer-btns{display:flex;gap:.5rem;margin-top:1rem;flex-wrap:wrap}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:1rem;color:#3d6428;font-size:1.1rem}
.spinner{width:40px;height:40px;border:4px solid #d4e8c0;border-top-color:#3d6428;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:24px;right:24px;background:#2d4a1e;border:1px solid #3d6428;border-radius:10px;padding:12px 20px;color:#f0e6c8;font-weight:600;z-index:2000;box-shadow:0 8px 32px rgba(0,0,0,.3);animation:slideUp .3s ease}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
@media print{nav,.hbtns,.br,.bi,button{display:none!important}.card{box-shadow:none;border:1px solid #ccc;break-inside:avoid}body{background:#fff}}
@media(max-width:600px){.kg{grid-template-columns:1fr 1fr}.fg .s2{grid-column:span 1}header h1{font-size:1.1rem}nav button{font-size:.72rem;padding:.55rem .65rem}.hbtns{width:100%}}
</style>
</head>

onValue(ref(db,"mov"), snap => {
  state.mov = snap.val() || {};
  state.loaded = true;
  render();
});
onValue(ref(db,"act"), snap => {
  state.act = snap.val() || {};
  render();
});
onValue(ref(db,"par"), snap => {
  if(snap.val()) state.par = snap.val();
  render();
});
onValue(ref(db,"campos"), snap => {
  state.camposList = snap.val() || {};
  render();
});

// Detectar conexión online/offline
onValue(ref(db,".info/connected"), snap => {
  state.online = snap.val() === true;
  render();
});

// ── HELPERS ──
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2);
function campos(){
  const fromList = Object.values(state.camposList).filter(c=>c.activo).map(c=>c.nombre).sort();
  if(fromList.length>0) return fromList;
  return [...new Set([...Object.values(state.mov).map(m=>m.campo),...Object.values(state.act).map(a=>a.campo)].filter(Boolean))].sort();
}
function ciclos(){ return [...new Set([...Object.values(state.mov).map(m=>m.ciclo),...Object.values(state.act).map(a=>a.ciclo)].filter(Boolean))]; }
function h(str){ return String(str||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function opts(arr,sel,empty){ return (empty?`<option value="">${empty}</option>`:"")+arr.map(v=>`<option${v===sel?" selected":""}>${h(v)}</option>`).join(""); }
function sem(val,min,suffix){
  suffix=suffix||"%";
  if(val===null||val===undefined||isNaN(val)) return `<span class="sg2">—</span>`;
  const ok=val>=min;
  return `<span class="${ok?"sg":"sr"}">${ok?"🟢":"🔴"} ${val.toFixed(1)}${suffix}</span>`;
}
function semMax(val,max,suffix){
  suffix=suffix||"%";
  if(val===null||val===undefined||isNaN(val)) return `<span class="sg2">—</span>`;
  const ok=val<=max;
  return `<span class="${ok?"sg":"sr"}">${ok?"🟢":"🔴"} ${val.toFixed(1)}${suffix}</span>`;
}
function pct(n,d){ return d>0 ? n/d*100 : null; }
function toast(msg){
  const el=document.createElement("div"); el.className="toast"; el.textContent=msg;
  document.body.appendChild(el); setTimeout(()=>el.remove(),3000);
}

// ── FIREBASE SAVE/DELETE ──
async function saveMov(data){
  const id = data.id || uid();
  await set(ref(db,`mov/${id}`),{...data,id});
  toast("✅ Movimiento guardado");
}
async function saveAct(data){
  const id = data.id || uid();
  await set(ref(db,`act/${id}`),{...data,id});
  toast("✅ Actividad guardada");
}
async function savePar(data){
  await set(ref(db,"par"),data);
  toast("✅ Parametros guardados");
}
async function delMov(id){ if(confirm("Eliminar movimiento?")){ await remove(ref(db,`mov/${id}`)); toast("Movimiento eliminado"); } }
async function delAct(id){ if(confirm("Eliminar actividad?")){ await remove(ref(db,`act/${id}`)); toast("Actividad eliminada"); } }

// ── RENDER ──
function render(){
  if(!state.loaded){ document.getElementById("root").innerHTML=`<div class="loading"><div class="spinner"></div><span>Conectando...</span></div>`; return; }
  document.getElementById("root").innerHTML = buildApp();
  attachEvents();
}

function buildApp(){
  return `
    ${buildHeader()}
    ${buildSyncBar()}
    <nav id="nav">${TABS.map((t,i)=>`<button class="${state.tab===i?"active":""}" data-tab="${i}">${h(t)}</button>`).join("")}</nav>
    ${buildModalCampos()}
    <main>
      ${state.tab===0 ? renderMov() : ""}
      ${state.tab===1 ? renderAct() : ""}
      ${state.tab===2 ? renderStock() : ""}
      ${state.tab===3 ? renderProd() : ""}
      ${state.tab===4 ? renderPar() : ""}
    </main>`;
}

function buildHeader(){
  return `<header>
    <img src="${LOGO}" alt="Logo"/>
    <div class="htitulo"><h1>Stock Ganadero</h1><p>Sistema de gestion de rodeo — Tiempo real</p></div>
    <div class="hbtns">
      <button class="hbtn grn" id="btnExcel">📊 Excel</button>
      <button class="hbtn blu" id="btnPDF">🖨️ PDF</button>
      <button class="hbtn org" id="btnBackup">💾 Backup</button>
    </div>
  </header>`;
}

function buildSyncBar(){
  const online = state.online;
  const nmov = Object.keys(state.mov).length;
  const nact = Object.keys(state.act).length;
  return `<div class="sync-bar">
    <span class="sync-dot${online?"":""} ${online?"":"offline"}"></span>
    <span>${online ? "🟢 Conectado — datos en tiempo real" : "🔴 Sin conexion — reconectando..."}</span>
    <span style="margin-left:auto;opacity:.7">${nmov} movimientos · ${nact} actividades</span>
  </div>`;
}

// ── STOCK ──
function renderStock(){
  const f=state.filtStock; const clist=campos();
  const fil=Object.values(state.mov).filter(m=>{
    if(f.hasta&&m.fecha>f.hasta)return false;
    if(f.campo&&m.campo!==f.campo)return false;
    if(f.cat&&m.cat!==f.cat)return false;
    return true;
  });
  const smap={};
  for(const m of fil){
    if(!smap[m.campo])smap[m.campo]={};
    if(!smap[m.campo][m.cat])smap[m.campo][m.cat]={stock:0,ing:0,egr:0,muertes:0};
    const r=smap[m.campo][m.cat];
    if(m.tipo==="ingreso"){r.stock+=m.cant;r.ing+=m.cant}
    else{r.stock-=m.cant;r.egr+=m.cant;if(m.sub==="Muerte")r.muertes+=m.cant}
  }
  const rows=[];
  for(const c of Object.keys(smap))for(const cat of Object.keys(smap[c])){const d=smap[c][cat];rows.push({campo:c,cat,...d,p:d.ing>0?d.muertes/d.ing*100:0})}
  const fechaCSV=f.hasta||new Date().toISOString().slice(0,10);
  const csv=[["Fecha","Campo","Categoria","Ingresos","Egresos","Muertes","% Muertes","Stock"],...rows.map(r=>[fechaCSV,r.campo,r.cat,r.ing,r.egr,r.muertes,r.p.toFixed(1),r.stock])].map(r=>r.join(",")).join("\n");
  const campos2=Object.keys(smap);
  return `
<div class="card">
  <h2>📊 Resumen de Stock</h2>
  <p class="hint">Filtra por fecha para ver el stock en una fecha determinada. CSV compatible con Power Query.</p>
  <div class="fg">
    <label>Stock al (fecha)<input type="date" value="${f.hasta}" onchange="setFS('hasta',this.value)"/></label>
    <label>Campo<select onchange="setFS('campo',this.value)">${opts(clist,f.campo,"Todos")}</select></label>
    <label>Categoria<select onchange="setFS('cat',this.value)">${opts(CATS,f.cat,"Todas")}</select></label>
  </div>
  <div class="br">
    <button class="bp" id="dlCSV">⬇️ Descargar CSV (Power Query)</button>
    <button class="bs" id="togCSV">${state.showCSV?"Ocultar":"Ver"} CSV</button>
  </div>
  ${state.showCSV?`<pre class="csvpre">${h(csv)}</pre>`:""}
</div>
${campos2.length===0?`<div class="card"><p class="empty">Sin datos.</p></div>`:`
${(()=>{
  // ── RESUMEN GENERAL TOTAL ──
  const allCats={};
  for(const campo of campos2){
    for(const [cat,d] of Object.entries(smap[campo])){
      if(!allCats[cat])allCats[cat]={ing:0,egr:0,muertes:0,stock:0};
      allCats[cat].ing+=d.ing; allCats[cat].egr+=d.egr;
      allCats[cat].muertes+=d.muertes; allCats[cat].stock+=d.stock;
    }
  }
  const gtotI=Object.values(allCats).reduce((s,d)=>s+d.ing,0);
  const gtotE=Object.values(allCats).reduce((s,d)=>s+d.egr,0);
  const gtotM=Object.values(allCats).reduce((s,d)=>s+d.muertes,0);
  const gtotS=Object.values(allCats).reduce((s,d)=>s+d.stock,0);
  // resumen por campo (una fila por campo)
  const campoTots=campos2.map(campo=>{
    const cats=smap[campo];
    return{
      campo,
      ing:Object.values(cats).reduce((s,d)=>s+d.ing,0),
      egr:Object.values(cats).reduce((s,d)=>s+d.egr,0),
      muertes:Object.values(cats).reduce((s,d)=>s+d.muertes,0),
      stock:Object.values(cats).reduce((s,d)=>s+d.stock,0)
    };
  });
  return `
<div class="card" style="border-top:4px solid #2d4a1e">
  <h2>🌐 Resumen General${f.hasta?" al "+f.hasta.split('-').reverse().join('/'):" (stock actual)"}</h2>
  <div class="kg" style="margin-bottom:1rem">
    <div class="kp" style="background:#eaf5e0;border-color:#3d6428">
      <div class="kl">Total Animales</div>
      <div class="kv" style="font-size:2rem;color:#2d4a1e">${gtotS}</div>
      <div class="km">${campos2.length} campo(s)</div>
    </div>
    ${campoTots.map(ct=>`
    <div class="kp">
      <div class="kl">🏡 ${h(ct.campo)}</div>
      <div class="kv">${ct.stock}</div>
      <div class="km">ing:+${ct.ing} egr:-${ct.egr}</div>
    </div>`).join("")}
  </div>
  <h3 style="margin-bottom:.7rem">📋 Total por Categoría (todos los campos)</h3>
  <div class="tw"><table>
    <thead><tr><th>Categoría</th><th>Ingresos</th><th>Egresos</th><th>Muertes</th><th>% Muertes</th><th>Stock Total</th></tr></thead>
    <tbody>
      ${Object.entries(allCats).sort((a,b)=>b[1].stock-a[1].stock).map(([cat,d])=>{
        const p=d.ing>0?d.muertes/d.ing*100:0;
        return`<tr>
          <td><strong>${h(cat)}</strong></td>
          <td class="ni">+${d.ing}</td>
          <td class="ne">-${d.egr}</td>
          <td>${d.muertes}</td>
          <td>${p>0?`<span class="${p>3?"sr":"sg"}">${p>3?"🔴":"🟢"} ${p.toFixed(1)}%</span>`:"—"}</td>
          <td><strong style="font-size:1rem;color:#2d4a1e">${d.stock}</strong></td>
        </tr>`;
      }).join("")}
      <tr class="tr">
        <td><strong>TOTAL GENERAL</strong></td>
        <td class="ni"><strong>+${gtotI}</strong></td>
        <td class="ne"><strong>-${gtotE}</strong></td>
        <td><strong>${gtotM}</strong></td>
        <td>—</td>
        <td><strong style="font-size:1.1rem;color:#2d4a1e">${gtotS}</strong></td>
      </tr>
    </tbody>
  </table></div>
</div>

<h3 style="margin:1rem 0 .5rem;color:#2d4a1e;font-size:.95rem;padding-left:.2rem">📍 Detalle por Campo</h3>
${campos2.map(campo=>{
  const cats=smap[campo];
  const totI=Object.values(cats).reduce((s,d)=>s+d.ing,0);
  const totE=Object.values(cats).reduce((s,d)=>s+d.egr,0);
  const totM=Object.values(cats).reduce((s,d)=>s+d.muertes,0);
  const totS=Object.values(cats).reduce((s,d)=>s+d.stock,0);
  return `<div class="card"><h3>🏡 ${h(campo)} <span style="font-size:.85rem;color:#888;font-weight:400">${totS} animales</span></h3><div class="tw"><table>
    <thead><tr><th>Categoría</th><th>Ingresos</th><th>Egresos</th><th>Muertes</th><th>% Muertes</th><th>Stock</th></tr></thead>
    <tbody>
      ${Object.entries(cats).map(([cat,d])=>{const p=d.ing>0?d.muertes/d.ing*100:0;return`<tr><td><strong>${h(cat)}</strong></td><td class="ni">+${d.ing}</td><td class="ne">-${d.egr}</td><td>${d.muertes}</td><td>${p>0?`<span class="${p>3?"sr":"sg"}">${p>3?"🔴":"🟢"} ${p.toFixed(1)}%</span>`:"—"}</td><td><strong class="${d.stock<0?"sr":""}">${d.stock}</strong></td></tr>`;}).join("")}
      <tr class="tr"><td><strong>TOTAL</strong></td><td class="ni"><strong>+${totI}</strong></td><td class="ne"><strong>-${totE}</strong></td><td><strong>${totM}</strong></td><td>—</td><td><strong>${totS}</strong></td></tr>
    </tbody>
  </table></div></div>`;
}).join("")}`;
})()}
`}`;
}

// ── PRODUCTIVO ──
function renderProd(){
  const f=state.filtProd; const clist=campos(); const cilist=ciclos(); const p=state.par;
  const camposE=f.campo?[f.campo]:[...new Set(Object.values(state.act).filter(a=>!f.ciclo||a.ciclo===f.ciclo).map(a=>a.campo).filter(Boolean))];
  const gac=(campo,ciclo,tipo,cats)=>Object.values(state.act).filter(a=>a.tipo===tipo&&(!campo||a.campo===campo)&&(!ciclo||a.ciclo===ciclo)&&cats.includes(a.cat)).reduce((s,a)=>s+(a.cant||0),0);
  const gkg=(campo,ciclo)=>Object.values(state.act).filter(a=>a.tipo==="Pesaje"&&(!campo||a.campo===campo)&&(!ciclo||a.ciclo===ciclo)&&["Terneros","Terneras"].includes(a.cat)).reduce((s,a)=>s+(a.kg||0),0);
  const rows=camposE.map(campo=>{
    const ent=gac(campo,f.ciclo,"Entore",["Vacas","Vaquillonas"])+gac(campo,f.ciclo,"IATF",["Vacas","Vaquillonas"]);
    const pre=gac(campo,f.ciclo,"Preñez",["Vacas","Vaquillonas"]);
    const nacT=Object.values(state.mov).filter(m=>m.tipo==="ingreso"&&m.sub==="Nacimiento"&&m.cat==="Terneros"&&m.campo===campo&&(!f.ciclo||m.ciclo===f.ciclo)).reduce((s,m)=>s+m.cant,0);
    const nacH=Object.values(state.mov).filter(m=>m.tipo==="ingreso"&&m.sub==="Nacimiento"&&m.cat==="Terneras"&&m.campo===campo&&(!f.ciclo||m.ciclo===f.ciclo)).reduce((s,m)=>s+m.cant,0);
    const nac=nacT+nacH;
    const dest=gac(campo,f.ciclo,"Destete",["Terneros","Terneras"]);
    const kgt=gkg(campo,f.ciclo);
    const cut=gac(campo,f.ciclo,"Cut",["Vacas","Vaquillonas"]);
    const dsc=gac(campo,f.ciclo,"Descarte",["Vacas","Vaquillonas"]);
    const seg=gac(campo,f.ciclo,"2da oportunidad",["Vacas","Vaquillonas"]);
    // Bases de calculo corregidas:
    // 1. Preñez: preñadas / entoradas
    // 2. Nacimientos: nacidos / preñadas
    // 3. Destete: destetados / preñadas
    // 4. Kg/animal: kg totales / preñadas
    // 5. Cut, Descarte, 2da oportunidad: / preñadas
    return{campo,ent,pre,nac,nacT,nacH,dest,kgt,cut,dsc,seg,
      pPre:pct(pre,ent),
      pNac:pct(nac,pre),
      pDest:pct(dest,pre),
      kgA:pre>0&&kgt>0?kgt/pre:null,
      pCut:pct(cut,pre),
      pDsc:pct(dsc,ent),
      pSeg:pct(seg,ent)};
  });
  const fv=(v)=>v!==null&&!isNaN(v)?v.toFixed(1)+"%":"—";
  return `
<div class="card">
  <h2>📈 Resumen Productivo</h2>
  <div class="fg">
    <label>Ciclo/ID<select onchange="setFP('ciclo',this.value)">${opts(cilist,f.ciclo,"Todos")}</select></label>
    <label>Campo<select onchange="setFP('campo',this.value)">${opts(clist,f.campo,"Todos")}</select></label>
  </div>
  <div style="background:#f0f5e8;border:1px solid #b8d4a0;border-radius:8px;padding:.7rem 1rem;font-size:.8rem;color:#3a5a1a;line-height:1.7">
    <strong>Bases de cálculo:</strong><br>
    % Preñez: meta <strong>${p.prenez}%</strong> — sobre <em>entoradas/IATF</em> &nbsp;|&nbsp;
    % Nacimientos: meta <strong>${p.nacimiento}%</strong> — sobre <em>preñadas</em> &nbsp;|&nbsp;

    <div class="kp"><div class="kl">Destetados</div><div class="kv">${r.dest}</div><div class="ks">${sem(r.pDest,p.destete)}</div><div class="km">meta: ${p.destete}% / preñadas</div></div>
    <div class="kp"><div class="kl">Kg/animal</div><div class="kv">${r.kgA?r.kgA.toFixed(1):"—"} kg</div><div class="ks">${sem(r.kgA,p.kgAnimal," kg")}</div><div class="km">meta: ${p.kgAnimal}kg / preñadas</div></div>

// ── PARAMETROS ──
function renderPar(){
  const p=state.par;
  const sl=(k,min,max,step,label,isMax)=>`
    <label>${h(label)} (${isMax?"maximo":"minimo"})
      <div class="rw">
        <input type="range" min="${min}" max="${max}" step="${step||1}" value="${p[k]}" oninput="updPar('${k}',this.value)"/>
        <span class="rv" id="rv_${k}">${p[k]}${k==="kgAnimal"?" kg":"%"}</span>
      </div>
    </label>`;
  return `
<div class="card">
  <h2>⚙️ Umbrales de Satisfaccion (Semaforos)</h2>
  <p class="hint">🔴 aparece cuando un indicador esta por debajo del minimo, o por encima del maximo (Cut/Descarte/2da). Los cambios se sincronizan para todo el equipo.</p>
  <div class="fg">
    ${sl("prenez",0,100,1,"% Preñez",false)}
    ${sl("nacimiento",0,100,1,"% Nacimientos — sobre preñadas",false)}
    ${sl("destete",0,100,1,"% Destete — sobre preñadas",false)}
    ${sl("kgAnimal",50,400,5,"Kg carne/animal — sobre preñadas",false)}
    ${sl("cut",0,50,1,"% Cut — sobre preñadas",true)}
    ${sl("descarte",0,50,1,"% Descarte — sobre entoradas",true)}
    ${sl("seg",0,50,1,"% 2da Oportunidad — sobre entoradas",true)}
  </div>
  <div class="tw" style="margin:.9rem 0"><table style="width:100%;border-collapse:collapse">
    <thead><tr><th>Indicador</th><th>Umbral</th><th>Semaforo rojo si...</th></tr></thead>
    <tbody>
      <tr><td>% Preñez</td><td>min ${p.prenez}%</td><td>menor al umbral</td></tr>
      <tr><td>% Nacimientos (s/preñadas)</td><td>min ${p.nacimiento}%</td><td>menor al umbral</td></tr>
      <tr><td>% Destete (s/preñadas)</td><td>min ${p.destete}%</td><td>menor al umbral</td></tr>
      <tr><td>Kg/animal (s/preñadas)</td><td>min ${p.kgAnimal}kg</td><td>menor al umbral</td></tr>
      <tr><td>% Cut (s/preñadas)</td><td>max ${p.cut}%</td><td>supera el umbral</td></tr>
      <tr><td>% Descarte (s/entoradas)</td><td>max ${p.descarte}%</td><td>supera el umbral</td></tr>
      <tr><td>% 2da Oportunidad (s/entoradas)</td><td>max ${p.seg}%</td><td>supera el umbral</td></tr>
    </tbody>
  </table></div>
  <div class="br"><button class="bp" id="savePar">💾 Guardar y sincronizar parametros</button></div>
</div>`;
}

// ── EXPORT EXCEL ──
function exportExcel(){
  const smap={};
  for(const m of Object.values(state.mov)){
    if(!smap[m.campo])smap[m.campo]={};
    if(!smap[m.campo][m.cat])smap[m.campo][m.cat]={ing:0,egr:0,muertes:0,stock:0};
    const r=smap[m.campo][m.cat];
    if(m.tipo==="ingreso"){r.stock+=m.cant;r.ing+=m.cant}else{r.stock-=m.cant;r.egr+=m.cant;if(m.sub==="Muerte")r.muertes+=m.cant}
  }
  const srows=[];
  for(const c of Object.keys(smap))for(const cat of Object.keys(smap[c])){const d=smap[c][cat];srows.push([c,cat,d.ing,d.egr,d.muertes,d.ing>0?(d.muertes/d.ing*100).toFixed(1)+"%":"0%",d.stock])}
  const sheets=[
    {name:"Movimientos",headers:["Fecha","Campo","Categoria","Ciclo","Tipo","Subtipo","Cantidad","Observaciones"],rows:Object.values(state.mov).sort((a,b)=>b.fecha.localeCompare(a.fecha)).map(m=>[m.fecha,m.campo,m.cat,m.ciclo||"",m.tipo,m.sub,m.cant,m.obs||""])},
    {name:"Actividades",headers:["Fecha","Campo","Categoria","Ciclo","Actividad","Cantidad","Kg Totales","Observaciones"],rows:Object.values(state.act).sort((a,b)=>b.fecha.localeCompare(a.fecha)).map(a=>[a.fecha,a.campo,a.cat,a.ciclo||"",a.tipo,a.cant!=null?a.cant:"",a.kg!=null?a.kg:"",a.obs||""])},
    {name:"Stock Resumen",headers:["Campo","Categoria","Ingresos","Egresos","Muertes","% Muertes","Stock"],rows:srows}
  ];
  let wb=`<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="UTF-8"><!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets>${sheets.map(s=>`<x:ExcelWorksheet><x:Name>${s.name}</x:Name><x:WorksheetSource HRef="#${s.name}"/></x:ExcelWorksheet>`).join("")}</x:ExcelWorksheets></x:ExcelWorkbook></xml><![endif]--></head><body>`;
  for(const s of sheets){
    wb+=`<table id="${s.name}"><thead><tr>${s.headers.map(hh=>`<th style="background:#2d4a1e;color:#f0e6c8;font-weight:bold">${hh}</th>`).join("")}</tr></thead><tbody>`;
    for(const row of s.rows)wb+=`<tr>${row.map(v=>`<td>${v}</td>`).join("")}</tr>`;
    wb+=`</tbody></table><br/>`;
  }
  wb+=`</body></html>`;
  const blob=new Blob([wb],{type:"application/vnd.ms-excel;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="StockGanadero_"+new Date().toISOString().slice(0,10)+".xls";a.click();
  toast("✅ Excel exportado");
}

function exportBackup(){
  const data={version:"2.0",fecha:new Date().toISOString(),mov:state.mov,act:state.act,par:state.par};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="StockGanadero_backup_"+new Date().toISOString().slice(0,10)+".json";a.click();
  toast("💾 Backup descargado");
}

// ── MODAL CAMPOS ──
function buildModalCampos(){
  if(!state.showModalCampos) return "";
  const lista = Object.entries(state.camposList).sort((a,b)=>a[1].nombre.localeCompare(b[1].nombre));
  const sel = state.campoSelModal;
  return `
  <div class="modal-overlay" id="modalCamposOverlay">
    <div class="modal-box">
      <h2>🏡 Administrar Campos</h2>
      <p>Seleccioná un campo para desactivarlo, o agregá uno nuevo.</p>
      <div>
        ${lista.length===0?`<p style="color:#aaa;text-align:center;padding:1rem">No hay campos aún. Agregá el primero.</p>`:
          lista.map(([id,c])=>`
          <div class="campo-item${c.activo?"":" inactivo"}${sel===id?" sel":""}" onclick="selCampoModal('${id}')">
            <span>${state.editandoCampo===id?
              `<input id="editCampoInput_${id}" value="${h(c.nombre)}" onclick="event.stopPropagation()" style="border:1.5px solid #3d6428;border-radius:5px;padding:.25rem .4rem;font-size:.88rem;width:160px" onkeydown="if(event.key==='Enter')guardarEditCampo('${id}')"/>`
              :h(c.nombre)}
            </span>
            <span style="display:flex;align-items:center;gap:.4rem">
              <span style="font-size:.75rem;color:${c.activo?"#3d6428":"#c84a28"}">${c.activo?"✅ Activo":"❌ Inactivo"}</span>
              ${sel===id && state.editandoCampo!==id?`<button onclick="event.stopPropagation();iniciarEditCampo('${id}')" style="background:#e8dfc8;border:1px solid #b8a888;border-radius:5px;padding:.2rem .5rem;cursor:pointer;font-size:.75rem">✏️ Editar</button>`:""}
              ${state.editandoCampo===id?`<button onclick="event.stopPropagation();guardarEditCampo('${id}')" style="background:#2d4a1e;color:#f0e6c8;border:none;border-radius:5px;padding:.2rem .5rem;cursor:pointer;font-size:.75rem">💾 Guardar</button><button onclick="event.stopPropagation();cancelarEditCampo()" style="background:#e8dfc8;border:1px solid #b8a888;border-radius:5px;padding:.2rem .5rem;cursor:pointer;font-size:.75rem">✕</button>`:""}
            </span>
          </div>`).join("")}
      </div>
      <div class="modal-add">
        <input id="nuevoCampoInput" placeholder="Nombre del nuevo campo..." onkeydown="if(event.key==='Enter')agregarCampo()"/>
        <button class="bp" onclick="agregarCampo()">Agregar</button>
      </div>
      <div class="modal-footer-btns">
        ${sel && state.editandoCampo!==sel?`<button class="bp" style="background:${state.camposList[sel]?.activo?"#c84a28":"#3d6428"}" onclick="toggleCampo('${sel}')">
          ${state.camposList[sel]?.activo?"❌ Desactivar seleccionado":"✅ Reactivar seleccionado"}
        </button>`:""}
        <button class="bs" onclick="cerrarModalCampos()" style="margin-left:auto">Cerrar</button>
      </div>
    </div>
  </div>`;
}

// ── EVENTS ──
function attachEvents(){
  // nav tabs
  document.querySelectorAll("[data-tab]").forEach(btn=>{
    btn.addEventListener("click",()=>{state.tab=parseInt(btn.dataset.tab);state.editMov=null;state.editAct=null;render();});
  });
  // header buttons
  const bx=document.getElementById("btnExcel"); if(bx)bx.onclick=exportExcel;
  const bp=document.getElementById("btnPDF"); if(bp)bp.onclick=()=>{toast("🖨️ Abriendo impresion...");setTimeout(()=>window.print(),400);};
  const bb=document.getElementById("btnBackup"); if(bb)bb.onclick=exportBackup;
  // mov
  const sm=document.getElementById("submitMov"); if(sm)sm.onclick=doSubmitMov;
  const cm=document.getElementById("cancelMov"); if(cm)cm.onclick=()=>{state.editMov=null;render();};
  // act
  const sa=document.getElementById("submitAct"); if(sa)sa.onclick=doSubmitAct;
  const ca=document.getElementById("cancelAct"); if(ca)ca.onclick=()=>{state.editAct=null;render();};
  // stock
  const dc=document.getElementById("dlCSV"); if(dc)dc.onclick=doDownloadCSV;
  const tc=document.getElementById("togCSV"); if(tc)tc.onclick=()=>{state.showCSV=!state.showCSV;render();};
  // par
  const sp=document.getElementById("savePar"); if(sp)sp.onclick=()=>savePar(state.par);
}

// ── GLOBAL FUNCTIONS (called from inline onclick) ──
window.updMovSub=function(){
  const t=document.getElementById("mti").value;
  const s=document.getElementById("msu");
  if(s)s.innerHTML=opts(t==="ingreso"?ING:EGR,"");
};
window.updActKg=function(){
  const t=document.getElementById("ati").value;
  const kl=document.getElementById("kglabel");
  if(kl)kl.style.display=t==="Pesaje"?"flex":"none";
};
window.setFM=function(k,v){state.filtMov[k]=v;render();};
window.setFA=function(k,v){state.filtAct[k]=v;render();};
window.setFS=function(k,v){state.filtStock[k]=v;render();};
window.setFP=function(k,v){state.filtProd[k]=v;render();};
window.updPar=function(k,v){
  state.par[k]=+v;
  const el=document.getElementById("rv_"+k);
  if(el)el.textContent=v+(k==="kgAnimal"?" kg":"%");
};
window.editMovBtn=function(id){state.editMov=state.mov[id];render();};
window.abrirModalCampos=function(){state.showModalCampos=true;state.campoSelModal=null;render();};
window.cerrarModalCampos=function(){state.showModalCampos=false;state.campoSelModal=null;render();};
window.selCampoModal=function(id){state.campoSelModal=state.campoSelModal===id?null:id;render();};
window.agregarCampo=async function(){
  const inp=document.getElementById("nuevoCampoInput");
  const nombre=(inp?inp.value:"").trim();
  if(!nombre)return alert("Escribí el nombre del campo.");
  const existe=Object.values(state.camposList).some(c=>c.nombre.toLowerCase()===nombre.toLowerCase());
  if(existe)return alert("Ese campo ya existe.");
  const id=uid();
  await set(ref(db,`campos/${id}`),{id,nombre,activo:true});
  if(inp)inp.value="";
  toast("✅ Campo '"+nombre+"' agregado");
};
window.iniciarEditCampo=function(id){state.editandoCampo=id;render();setTimeout(()=>{const inp=document.getElementById("editCampoInput_"+id);if(inp){inp.focus();inp.select();}},50);};
window.cancelarEditCampo=function(){state.editandoCampo=null;render();};
window.guardarEditCampo=async function(id){
  const inp=document.getElementById("editCampoInput_"+id);
  if(!inp)return;
  const nuevoNombre=inp.value.trim();
  if(!nuevoNombre)return alert("El nombre no puede estar vacío.");
  const c=state.camposList[id];
  if(!c)return;
  // Update campo name in Firebase
  await set(ref(db,`campos/${id}`),{...c,nombre:nuevoNombre});
  // Also update all movimientos and actividades with old name
  const oldNombre=c.nombre;
  const movsToUpdate=Object.values(state.mov).filter(m=>m.campo===oldNombre);
  const actsToUpdate=Object.values(state.act).filter(a=>a.campo===oldNombre);
  for(const m of movsToUpdate) await set(ref(db,`mov/${m.id}`),{...m,campo:nuevoNombre});
  for(const a of actsToUpdate) await set(ref(db,`act/${a.id}`),{...a,campo:nuevoNombre});
  state.editandoCampo=null;
  toast(`✅ Campo renombrado a "${nuevoNombre}" (${movsToUpdate.length} mov. y ${actsToUpdate.length} act. actualizados)`);
};
window.toggleCampo=async function(id){
  const c=state.camposList[id]; if(!c)return;
  await set(ref(db,`campos/${id}`),{...c,activo:!c.activo});
  toast(c.activo?"Campo desactivado":"Campo reactivado");
  state.campoSelModal=null;
};
window.editActBtn=function(id){state.editAct=state.act[id];render();};
window.delMov=delMov;
window.delAct=delAct;

function doSubmitMov(){
  const fecha=document.getElementById("mf").value;
  const campo=document.getElementById("mc").value;
  const cat=document.getElementById("mcat").value;
  const ciclo=document.getElementById("mci").value.trim();
  const tipo=document.getElementById("mti").value;
  const sub=document.getElementById("msu").value;
  const cant=parseInt(document.getElementById("mca").value);
  const obs=document.getElementById("mob").value.trim();
  if(!fecha||!campo||!cat||!cant)return alert("Completa: fecha, campo, categoria y cantidad.");
  const e={fecha,campo,cat,ciclo,tipo,sub,cant,obs,id:state.editMov?state.editMov.id:uid()};
  saveMov(e).then(()=>{state.editMov=null;});
}
function doSubmitAct(){
  const fecha=document.getElementById("af").value;
  const campo=document.getElementById("ac").value;
  const cat=document.getElementById("acat").value;
  const ciclo=document.getElementById("aci").value.trim();
  const tipo=document.getElementById("ati").value;
  const cantVal=document.getElementById("aca").value;
  const kgEl=document.getElementById("akg");
  const cant=cantVal?parseInt(cantVal):null;
  const kg=kgEl&&kgEl.value?parseFloat(kgEl.value):null;
  const obs=document.getElementById("aob").value.trim();
  if(!fecha||!campo||!cat||!tipo)return alert("Completa: fecha, campo, categoria y actividad.");
  const e={fecha,campo,cat,ciclo,tipo,cant:isNaN(cant)?null:cant,kg,obs,id:state.editAct?state.editAct.id:uid()};
  saveAct(e).then(()=>{state.editAct=null;});
}
function doDownloadCSV(){
  const f=state.filtStock;
  const fil=Object.values(state.mov).filter(m=>{
    if(f.hasta&&m.fecha>f.hasta)return false;
    if(f.campo&&m.campo!==f.campo)return false;
    if(f.cat&&m.cat!==f.cat)return false;
    return true;
  });
  const smap={};
  for(const m of fil){
    if(!smap[m.campo])smap[m.campo]={};
    if(!smap[m.campo][m.cat])smap[m.campo][m.cat]={ing:0,egr:0,muertes:0,stock:0};
    const r=smap[m.campo][m.cat];
    if(m.tipo==="ingreso"){r.stock+=m.cant;r.ing+=m.cant}else{r.stock-=m.cant;r.egr+=m.cant;if(m.sub==="Muerte")r.muertes+=m.cant}
  }
  const rows=[];
  for(const c of Object.keys(smap))for(const cat of Object.keys(smap[c])){const d=smap[c][cat];rows.push([c,cat,d.ing,d.egr,d.muertes,d.ing>0?(d.muertes/d.ing*100).toFixed(1)+"%":"0%",d.stock])}
  const csv=[["Campo","Categoria","Ingresos","Egresos","Muertes","% Muertes","Stock"],...rows].map(r=>r.join(",")).join("\n");
  const fechaStr=f.hasta?f.hasta:new Date().toISOString().slice(0,10);
  const fechaCSV2=fechaStr;
  const smap2={};
  for(const m of fil){
    if(!smap2[m.campo])smap2[m.campo]={};
    if(!smap2[m.campo][m.cat])smap2[m.campo][m.cat]={ing:0,egr:0,muertes:0,stock:0};
    const r=smap2[m.campo][m.cat];
    if(m.tipo==="ingreso"){r.stock+=m.cant;r.ing+=m.cant}else{r.stock-=m.cant;r.egr+=m.cant;if(m.sub==="Muerte")r.muertes+=m.cant}
  }
  const rows2=[];
  for(const c of Object.keys(smap2))for(const cat of Object.keys(smap2[c])){const d=smap2[c][cat];rows2.push([fechaCSV2,c,cat,d.ing,d.egr,d.muertes,d.ing>0?(d.muertes/d.ing*100).toFixed(1):"0.0",d.stock])}
  const csvFinal=[["Fecha","Campo","Categoria","Ingresos","Egresos","Muertes","% Muertes","Stock"],...rows2].map(r=>r.join(",")).join("\n");
  const blob=new Blob(["\ufeff"+csvFinal],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="StockGanadero_al_"+fechaStr+".csv";a.click();
}
